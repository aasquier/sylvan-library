slug: atla-palani-dinos
name: Atla Palani, Nest Tender — Naya Dinosaurs
status: built  # built: the cards are sleeved up
commander:
  - Atla Palani, Nest Tender
commander_art: c851c20d-a028-4af9-bcfa-36ceaf36bdfb
bracket: 4

strategy: >
  Naya "big boom-boom" — a deck built entirely around ignoring mana costs. Atla
  turns {2} and a tap into a 0/1 Egg, and when any Egg dies she reveals from
  the top until she hits a creature card and puts it onto the battlefield. The
  Egg is a two-mana coupon for the biggest creature in the library, so a
  15-drop and a 5-drop cost exactly the same. Everything in the deck serves
  that one exchange: make Eggs, crack Eggs for free and repeatedly, and make
  sure whatever comes off the top is enormous.

notes:
  commander_why: >
    Atla is a Shaman, which is the entire reason Thornbite Staff is in the
    deck — the Staff attaches to her for free whenever a Shaman enters,
    including every recast from the command zone, and removes the
    one-Egg-per-turn ceiling.
  gameplan: >
    Ramp on 1-3 with noncreature ramp so the Egg pool stays undiluted, land
    Atla, then get a free sacrifice outlet online. From there every turn should
    crack at least one Egg. You are not casting your threats; you are drawing
    them off the top of the library two mana at a time.
  mulligan: >
    — not yet derived from a Tier 1 sweep. When it is, note that Tier 1 models
    casting spells for mana and will systematically understate this deck, whose
    whole plan is putting creatures onto the battlefield without casting them.
  curve_plan: >
    — not yet recounted from the corpus. Note that nominal mana value is close
    to meaningless here: the titans are 12-15 MV cards the deck never intends
    to cast.
  pitfalls: >
    (1) The trigger lives on ATLA, not on the Egg token — she must be on the
    battlefield when the Egg dies, though she may die simultaneously with the
    Eggs and it still triggers. (2) Creatures put onto the battlefield this way
    are NOT cast, so cast-triggers do nothing (Emrakul's extra turn is lost,
    Zacama's untap-all-lands only happens on a hard cast) while
    enters-the-battlefield triggers work perfectly. (3) Every cheap creature is
    a permanent tax on every Egg you will ever crack — the creature mix is the
    only thing that determines hit quality, since lands and spells are skipped.
  engine_detail: >
    Because the library is randomly ordered, the topmost creature card is a
    uniformly random creature card from your library. That is why the deck runs
    26 creatures and why almost all of them are enormous. Simulated over
    200,000 Egg cracks, the titan module (Emrakul, Blightsteel Colossus, It
    That Betrays, Worldspine Wurm) moved mean mana value hit from 6.35 to 7.80,
    chance of a 10+ power hit from 15% to 30%, and dud rate (MV<=3) from 12% to
    8%. The honest cost: 23% of opening hands contain a titan you cannot cast.
  lines: >
    Worldly Tutor and Congregation at Dawn convert the random Egg into a
    tutor — stack the top, then crack. Natural Order works because Atla's Egg
    tokens are green, so an Egg pays the cost and triggers her on the way out.
    Savage Order does NOT work that way: its additional cost needs power 4 or
    greater, which an Egg cannot pay. Roaming Throne naming Shaman doubles
    every Egg death into two creatures.
  wincons: >
    Craterhoof or End-Raze Forerunners on a board of titans, Xenagos pointing
    at a freshly hatched Ghalta for 24 trampling damage, Terror of the Peaks
    converting every Egg crack into direct damage, or Blightsteel Colossus
    connecting once for eleven poison.
  manabase: >
    36 land slots — 34 lands plus 2 modal double-faced cards. Basics shifted
    from 10/2/2 to 8/3/3 to support the double-pip costs: {3}{R}{R} on Terror
    of the Peaks and Nesting Dragon, {W}{W} on Ghalta and Mavren, plus Akroma's
    Will and Xenagos. Not yet confirmed by an mtglab land sweep.
  matchups: >
    — unmeasured. The pod simulator that would answer this is not built yet.
  politics: >
    Blightsteel Colossus generates more table friction than anything else in
    the deck. Pod-check the infect plan before sitting down.
  failure_modes: >
    Atla answered repeatedly with no free sacrifice outlet down, or an opening
    hand with two titans and no ramp. Bonehoard Dracosaur is the designated
    rebuild card.
  swap_philosophy: >
    The purist tweak is cutting the remaining small creatures for more fatties,
    which drops the dud rate to roughly 4% at the cost of real early ramp. Play
    it as printed first.
  rules_corners: >
    Any Egg counts, not just Atla's — Palani's Hatcher's Dinosaur Eggs and
    Nesting Dragon's Dragon Eggs all turn her on. Rhythm of the Wild's riot
    applies to creatures put onto the battlefield by Eggs, not just cast ones,
    which is why it is the deck's most important haste source; Palani's Hatcher
    only hastes Dinosaurs and the titans are not Dinosaurs. Concordant
    Crossroads is a world enchantment, so another world permanent entering play
    kills it. Cavern of Souls and Secluded Courtyard only make {C} toward Atla
    herself, since she is a Human Shaman rather than a Dinosaur.

cards:
  # ---------------------------------------- EGG MAKERS & CRACKERS 11
  - name: Palani's Hatcher
    category: engine
    why: >
      Best non-commander card in the deck. Enters making two Egg tokens, hastes
      your other Dinosaurs, and at the beginning of combat sacrifices an Egg
      automatically — a free Atla trigger every single combat.
  - name: Nesting Dragon
    category: engine
    why: >
      Landfall makes a 0/2 Dragon Egg. With 36 land slots and three fetchlands
      this quietly doubles your triggers, and each Egg leaves a 2/2 flying
      Dragon behind.
  - name: Marauding Raptor
    category: engine
    why: >
      Creature spells cost {1} less, and whenever another creature you control
      enters it takes 2 damage — killing a 0/1 or 0/2 Egg on the spot. Free,
      automatic, repeatable Egg-cracking, and every haymaker survives it.
  - name: Roaming Throne
    category: engine
    why: >
      Name Shaman and every Egg death cheats in two creatures instead of one.
      Name Dinosaur when Gishath or Palani's Hatcher is the more important
      trigger.
  - name: Skullclamp
    category: card-advantage
    why: >
      Equip {1} to a 0/1 Egg — it becomes 1/0 and dies immediately. Draw two
      cards and cheat in a monster, every turn, for one mana.
  - name: Ashnod's Altar
    category: sac-outlet
    why: >
      Free outlet, and the two colourless exactly pays Atla's {2} activation,
      which is what makes the loop free.
  - name: Phyrexian Altar
    category: sac-outlet
    why: Same job as Ashnod's, one mana of any colour instead of two colourless. Slower for the loop, more flexible for casting.
  - name: Blasting Station
    category: sac-outlet
    why: Free outlet that untaps whenever a creature enters, so every monster you cheat in re-arms it. Also the safety valve on the Polyraptor line.
  - name: Goblin Bombardment
    category: sac-outlet
    why: >
      Cheapest unconditional free outlet in the colours, and it converts a board
      of Dinosaurs into direct damage — your way through fogs, blockers and
      pillow forts.
  - name: Thornbite Staff
    category: engine
    why: >
      Equipped creature gains "whenever a creature dies, untap this creature",
      and it attaches to Atla for free whenever a Shaman enters. Removes the
      one-Egg-per-turn ceiling.
  - name: Thousand-Year Elixir
    category: engine
    why: Atla can activate the turn she lands, plus {1}, {T}, untap her for a second Egg.

  # ----------------------------------------------------- RAMP & FIXING 9
  - name: Sol Ring
    category: ramp
    why: Turn one into turn-three Atla.
  - name: Arcane Signet
    category: ramp
    why: All three colours, and the mana pays Atla's activation.
  - name: Nature's Lore
    category: ramp
    why: Fetches Stomping Ground, Temple Garden or Sacred Foundry untapped.
  - name: Three Visits
    category: ramp
    why: Functional copy of Nature's Lore. Redundancy is consistency.
  - name: Cultivate
    category: ramp
    why: Fixes and guarantees the next land drop.
  - name: Skyshroud Claim
    category: ramp
    why: Four mana, two dual lands untapped. A turn-four Skyshroud is a turn-five Gishath.
  - name: The Great Henge
    category: card-advantage
    why: >
      Often {2}{G}{G} here. Taps for {G}{G} plus 2 life, and draws a card plus
      adds a counter whenever a NONTOKEN creature enters — Egg tokens do not
      trigger it, but the creature the Egg fetches does.
  - name: Smothering Tithe
    category: ramp
    why: The mana that lets you activate Atla twice and still hold up protection.
  - name: Selvala, Heart of the Wilds
    category: ramp
    why: Taps for mana equal to your biggest creature's power — routinely 5-12.

  # ------------------------------------------- TUTORS & CHEAT-INTO-PLAY 8
  - name: Worldly Tutor
    category: tutor
    why: >
      {G} instant, put any creature on top of your library, then crack an Egg
      to put exactly that creature onto the battlefield. Turns the random Egg
      into a tutor.
  - name: Congregation at Dawn
    category: tutor
    why: Instant, stacks the top three creatures in the order you choose. Three cracks, three chosen monsters.
  - name: Natural Order
    category: tutor
    why: >
      Sacrifice a green creature for any green creature onto the battlefield.
      Atla's Egg tokens are green, so an Egg pays the cost and triggers her on
      the way out.
  - name: Savage Order
    category: tutor
    why: >
      Tutors a Dinosaur straight onto the battlefield with indestructible. Its
      additional cost sacrifices a creature with power 4 or greater, so Eggs do
      NOT pay for this.
  - name: Defense of the Heart
    category: tutor
    why: If it survives one rotation it puts two creatures onto the battlefield free. It also soaks removal that would otherwise hit Atla.
  - name: Invasion of Ikoria
    category: tutor
    why: >
      Searches library AND graveyard for a non-Human creature of mana value X
      or less and puts it onto the battlefield. Its flip side Zilortha lets
      your non-Humans assign combat damage as though unblocked.
  - name: Monster Manual
    category: tutor
    why: >
      {1}{G}, {T}, put a creature from hand onto the battlefield, repeatable.
      Its Adventure half mills five and returns a creature to hand first — one
      of the ways the deck unloads a stranded titan.
  - name: Smuggler's Surprise
    category: tutor
    why: Flexible and instant speed — dig four for creatures, or slam one from hand mid-combat.

  # ------------------------------------------------------ THE PAYLOAD 21
  - name: Ghalta, Primal Hunger
    category: threat
    why: 12/12 trample for twelve mana you will never pay.
  - name: Emrakul, the Aeons Torn
    category: threat
    why: >
      15/15 flying, annihilator 6, and protection from spells that are one or
      more colours — essentially no removal in a normal pod touches her.
      Colourless, so her identity is empty and she is legal in Naya. The
      extra-turn trigger is a cast trigger and is lost; you do not care.
  - name: Blightsteel Colossus
    category: win-con
    why: >
      11/11 trample, infect, indestructible. Eleven poison is one more than a
      player needs, so a single connection kills outright, and it shuffles
      itself back in instead of dying. Pod-check this one.
  - name: It That Betrays
    category: threat
    why: >
      11/11 annihilator 2, and whenever an opponent sacrifices a nontoken
      permanent you put that card onto the battlefield under your control. Its
      own annihilator feeds it.
  - name: Worldspine Wurm
    category: threat
    why: >
      15/15 trample that leaves three 5/5 tramplers when it dies and then
      shuffles itself back into your library — a renewable Egg hit, and a legal
      Natural Order target unlike the colourless titans.
  - name: Ghalta, Stampede Tyrant
    category: threat
    why: >
      12/12 trample, and when it ENTERS you put any number of creature cards
      from your hand onto the battlefield. Cheating it in off an Egg dumps your
      whole hand of monsters at once.
  - name: Ghalta and Mavren
    category: threat
    why: 12/12 trample. On attack, either a Dinosaur token as big as your largest other attacker, or a lifelinking Vampire per attacker.
  - name: Apex Altisaur
    category: threat
    why: Enters and fights each creature one opponent controls — a one-sided sweeper stapled to a 10/10.
  - name: Zacama, Primal Calamity
    category: threat
    why: >
      9/9 vigilance, reach and trample with three activated abilities. The
      untap-all-lands trigger only happens on a hard cast; cheating it in still
      gets the Swiss-army 9/9.
  - name: Terastodon
    category: interaction
    why: Destroys up to three target noncreature permanents on entry. The deck's answer to problem artifacts, enchantments and lands — and it is a 9/9.
  - name: Craterhoof Behemoth
    category: win-con
    why: Enters with haste; your team gains trample and +X/+X for your creature count.
  - name: End-Raze Forerunners
    category: win-con
    why: >
      7/7 with vigilance, trample and haste, and on entry your other creatures
      get +2/+2 and gain vigilance and trample. A second Craterhoof that brings
      its own haste.
  - name: Dragonlord Atarka
    category: threat
    why: 8/8 flying trample, and on entry deals 5 damage divided as you choose among opponents' creatures and planeswalkers.
  - name: Gishath, Sun's Avatar
    category: threat
    why: Connect once and dump Dinosaurs off the top for free. Palani's Hatcher gives him haste the turn he arrives.
  - name: Etali, Primal Conqueror
    category: threat
    why: Enters and lets you cast free spells off the top of every library.
  - name: Zopandrel, Hunger Dominus
    category: threat
    why: >
      At the beginning of each combat it doubles the power and toughness of
      every creature you control. With four fatties out that alone is lethal.
      Not a Dinosaur, so no haste from Palani's Hatcher.
  - name: Terror of the Peaks
    category: win-con
    why: >
      Every creature that enters shoots any target for its power. Egg cracks
      become removal, and a big turn becomes 20+ damage without attacking. Also
      what turns the Polyraptor line into a win rather than a draw.
  - name: Polyraptor
    category: threat
    why: 5/5 that copies itself whenever it is dealt damage. A combo piece — check the Polyraptor line before deploying it.
  - name: Vaultborn Tyrant
    category: card-advantage
    why: >
      6/6 trample. Whenever it or another creature with power 4 or greater
      enters, gain 3 life and draw a card. When it dies it leaves an artifact
      copy of itself.
  - name: Bonehoard Dracosaur
    category: card-advantage
    why: Free card advantage every upkeep with no setup — the best "rebuild after a wipe" card in the deck.
  - name: Dinosaurs on a Spaceship
    category: threat
    why: 7/7 that gives every other Dinosaur +1/+1, vigilance and trample. Trample is what converts a big board into a dead opponent.

  # ----------------------------------------------------- CARD ADVANTAGE 3
  - name: Garruk's Uprising
    category: card-advantage
    why: Draws on entry, gives the team trample, and draws whenever a 4-power creature enters — essentially every Egg crack.
  - name: Elemental Bond
    category: card-advantage
    why: Same trigger as Garruk's Uprising, cheaper, harder to answer.
  - name: Return of the Wildspeaker
    category: card-advantage
    why: Instant, draw 4-6, or a surprise +3/+3 team pump for the kill. That flexibility is why it beats Colossal Majesty.

  # -------------------------------------------- HASTE, ANTHEMS, FINISHERS 4
  - name: Rhythm of the Wild
    category: payoff
    why: >
      Riot applies to creatures put onto the battlefield by Eggs, not just cast
      ones, so every hit can arrive with haste. The deck's most important haste
      source, because Palani's Hatcher only hastes Dinosaurs and the titans are
      not Dinosaurs.
  - name: Concordant Crossroads
    category: payoff
    why: >
      {G} and all creatures have haste, so every monster an Egg produces can
      attack the moment it lands. Symmetrical, and a world enchantment, so
      another world permanent entering play kills it.
  - name: Xenagos, God of Revels
    category: payoff
    why: At the beginning of combat another creature gets +X/+X where X is its power, and gains haste. Point it at a fresh Ghalta for 24 trampling damage.
  - name: Akroma's Will
    category: protection
    why: >
      With your commander out you get both modes — simultaneously an
      unblockable alpha strike (flying plus protection from every colour) and a
      hard answer to a board wipe.

  # -------------------------------------------------- PROTECTION & REMOVAL 6
  - name: Lightning Greaves
    category: protection
    why: Shroud plus haste — the cheapest way to make Atla stick and activate at once.
  - name: Heroic Intervention
    category: protection
    why: Two mana, beats wraths and spot removal alike.
  - name: Flawless Maneuver
    category: protection
    why: Free with Atla out. Beats a board wipe.
  - name: Deflecting Swat
    category: protection
    why: Free with Atla out. Redirects the removal aimed at her, or an opponent's tutor or counterspell.
  - name: Swords to Plowshares
    category: interaction
    why: Best one-mana removal in Magic; answers the one blocker you cannot punch through.
  - name: Beast Within
    category: interaction
    why: Answers anything. The 3/3 they get is irrelevant to a deck making 12/12s.

  # ------------------------------------------------------------- UTILITY 1
  - name: Welcome to . . .
    category: utility
    why: >
      Chapter II makes a hasty 3/3; chapter III flips it into a legendary land
      that taps for {G} per Dinosaur you control and gives every Dinosaur in
      your graveyard escape. A Gaea's Cradle plus a recursion engine in one
      slot.

