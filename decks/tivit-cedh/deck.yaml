  - name: The One Ring
    category: engine
    why: Protection from everything for a turn, then a draw engine. Great under aggro.
  - name: Esper Sentinel
    category: engine
    why: Taxes every rock and cantrip; draws or slows the table either way.
  - name: Archivist of Oghma
    category: engine
    why: Punishes fetchlands and tutors — every deck at this table does both.
  - name: Wan Shi Tong, Librarian
    category: engine
    why: Flash, and every opponent search grows it and draws you a card. A tutor-heavy pod feeds it constantly.
  - name: Faerie Mastermind
    category: engine
    why: Flash blocker, taxes draw engines, occasionally a big refill.
  - name: Lotho, Corrupt Shirriff
    category: engine
    why: >
      A Treasure every time any player casts their second spell that turn —
      ramp and artifact count in one two-drop, and a Time Sieve bridge once an
      opponent dies.
  - name: Necropotence
    category: engine
    why: If the game goes long, this ends the card-advantage argument permanently.

  # ------------------------------------------------------------- TUTORS 10
  - name: Demonic Tutor
    category: tutor
    why: Unconditional, two mana, to hand.
  - name: Vampiric Tutor
    category: tutor
    why: Instant speed at the cost of a card and 2 life; pairs with the fetch shuffles.
  - name: Imperial Seal
    category: tutor
    why: Sorcery-speed Vampiric, and the fetchlands fix the top-of-library cost.
  - name: Mystical Tutor
    category: tutor
    why: Finds Consultation, a counter, or Cyclonic Rift at instant speed.
  - name: Enlightened Tutor
    category: tutor
    why: Finds Time Sieve, Rhystic Study, Grafdigger's Cage or a Mox.
  - name: Wishclaw Talisman
    category: tutor
    why: >
      The strongest tutor here if used correctly — only crack it when you can
      win on the spot, or when the next player is dead before untapping.
  - name: Whir of Invention
    category: tutor
    why: Finds Time Sieve at instant speed off Treasures.
  - name: Transmute Artifact
    category: tutor
    why: Second copy of the Time Sieve tutor effect.
  - name: Muddle the Mixture
    category: tutor
    why: >
      Transmutes for exactly Thassa's Oracle, Dark Ritual or a Talisman, and
      otherwise counters a combo piece.
  - name: Beseech the Mirror
    category: tutor
    why: With a spare Clue or Treasure to bargain, casts Demonic Consultation or Time Sieve for free.

  # ------------------------------------------- COMBO, COPY AND RECURSION 8
  - name: Thassa's Oracle
    category: win-con
    why: The win. Hold priority with the ETB trigger on the stack, then empty your library.
  - name: Demonic Consultation
    category: win-con
    why: Name a card not in your deck; two cards and four mana total for the primary kill.
  - name: Tainted Pact
    category: win-con
    why: >
      Second Consultation, live only because no card name is duplicated in the
      deck — one Island, one Swamp.
  - name: Time Sieve
    category: win-con
    why: With Tivit connecting, five artifacts per trigger becomes infinite turns for two mana.
  - name: Displacer Kitten
    category: engine
    why: Blinks Teferi on every noncreature spell — the third win line's engine half.
  - name: Teferi, Time Raveler
    category: engine
    why: >
      The Kitten line's other half, and his static locks opponents to sorcery
      speed while you go off.
  - name: Sevinne's Reclamation
    category: recursion
    why: >
      Rebuys a Sieve, a Mox or the Oracle from the yard, and it flashes back —
      two answers to a Toxic Deluge in one card.
  - name: Phyrexian Metamorph
    category: threat
    why: >
      Copies the table's best artifact or creature, and counts as artifact
      number three for Mox Opal.

  # ------------------------------------------------ PROTECTION AND HATE 8
  - name: Silence
    category: protection
    why: The cheapest "I win now" enabler in the deck.
  - name: Grand Abolisher
    category: protection
    why: Same effect as Silence but permanent, and it protects Tivit in combat too.
  - name: Voice of Victory
    category: protection
    why: >
      A Silence that stays. Legal in Esper because its Warrior tokens are red
      but the card has no red mana symbols, so its identity is white only.
  - name: Drannith Magistrate
    category: protection
    why: Shuts off every commander in the pod, including the ones that combo from the zone.
  - name: Opposition Agent
    category: interaction
    why: Steals a tutor and often just wins the turn it lands, with flash.
  - name: Ranger-Captain of Eos
    category: protection
    why: Fetches Esper Sentinel or Mental Misstep, then sacrifices for a free Silence on the turn you go off.
  - name: Grafdigger's Cage
    category: interaction
    why: >
      Blanks Underworld Breach, Yawgmoth's Will and tutor-to-battlefield
      effects. It also turns off your own Sevinne's flashback — sequence
      around it.
  - name: Cursed Totem
    category: interaction
    why: >
      Kills mana dorks, Thrasios and creature-tutor engines. Does not touch
      Tivit, Time Sieve, Clues, Treasures or the Oracle trigger, but it does
      shut off Ranger-Captain's sacrifice.

  # -------------------------------------------------------- COUNTERMAGIC 11
  - name: Force of Will
    category: protection
    why: Free counter — one of the four that let you tap out for Tivit and still hold the table.
  - name: Force of Negation
    category: protection
    why: Free counter for noncreature spells, which is most of what kills you.
  - name: Fierce Guardianship
    category: protection
    why: Free counter while you control your commander.
  - name: Pact of Negation
    category: protection
    why: Free counter on the turn you win, when the upkeep cost never comes due.
  - name: Mana Drain
    category: interaction
    why: Counter plus a burst of mana for the following turn.
  - name: Flusterstorm
    category: protection
    why: The cheapest way to protect your own combo through a counter war.
  - name: Mental Misstep
    category: interaction
    why: Free answer to Consultation, Swords, Vampiric Tutor and mana dorks.
  - name: Swan Song
    category: protection
    why: One mana; hold it for the win attempt, not for a Rhystic Study.
  - name: An Offer You Can't Refuse
    category: protection
    why: One mana; the Treasures given away rarely matter in the turn you win.
  - name: Mindbreak Trap
    category: interaction
    why: The answer to a resolved storm turn.
  - name: Dispel
    category: protection
    why: Cheapest protection for your own combo against instant-speed answers.

  # ------------------------------------------- REMOVAL AND DISRUPTION 9
  - name: Swords to Plowshares
    category: interaction
    why: One mana, exiles anything relevant.
  - name: Path to Exile
    category: interaction
    why: Second Swords; the land given up rarely decides a cEDH game.
  - name: Toxic Deluge
    category: interaction
    why: >
      Your only sweeper — answers Opposition Agent, Bowmasters and go-wide
      boards for three mana at any life total you choose to pay.
  - name: Cyclonic Rift
    category: interaction
    why: The catch-all reset, and a win-turn clear for blockers.
  - name: Chain of Vapor
    category: interaction
    why: One-mana bounce for a hatebear or your own permanent in response to removal.
  - name: Sink into Stupor
    category: interaction
    why: >
      Bounces a spell or a nonland permanent, and it is a land when you are
      short — one of the best flex slots printed.
  - name: Orcish Bowmasters
    category: interaction
    why: >
      Kills Thassa's Oracle and hatebears at flash speed while punishing every
      draw engine.
  - name: Dauthi Voidwalker
    category: interaction
    why: Graveyard hate that steals their win condition, on an unblockable 3/2.
  - name: Imposter Mech
    category: interaction
    why: >
      Copies an opponent's best creature as a noncreature Vehicle, dodging
      creature removal and wraths, and it is a cheap artifact for Mox Opal and
      Time Sieve.

swap_board:
  - name: Academy Manufactor
    category: engine
    why: In for Faerie Mastermind. Turns each Tivit trigger into 15 artifacts. Wildly redundant for Time Sieve, dead on its own.
  - name: Underworld Breach
    category: win-con
    why: The "value Breach" build with Lion's Eye Diamond and Brain Freeze; adds a third win but wants a more storm-focused shell.
  - name: Lion's Eye Diamond
    category: ramp
    why: The Breach package's mana half.
  - name: Brain Freeze
    category: win-con
    why: The Breach package's mill half — loop to mill yourself, then escape Thassa's Oracle.
  - name: Urza, Lord High Artificer
    category: engine
    why: In for Necropotence. Makes mana from your artifact pile and doubles as a Time Sieve enabler.
  - name: Gilded Drake
    category: interaction
    why: In for Toxic Deluge. Steals a commander instead of killing a board; better in creature-heavy metas.
  - name: Timetwister
    category: engine
    why: In for Faerie Mastermind, if money genuinely is not a factor.
  - name: Trickbind
    category: interaction
    why: In for Dispel. Answers Thassa's Oracle triggers, Wishclaw activations and fetchlands.
  - name: Notion Thief
    category: engine
    why: In for Archivist of Oghma. Blowout against Wheel and Ad Nauseam decks.
  - name: Narset, Parter of Veils
    category: engine
    why: In for Faerie Mastermind. Same job, stickier, worse ceiling.
  - name: Aven Mindcensor
    category: interaction
    why: In for Imposter Mech. Flash tutor-hate in a tutor-heavy pod.
  - name: Mnemonic Betrayal
    category: engine
    why: In for Beseech the Mirror. Steals three graveyards' worth of answers on the turn you win.
