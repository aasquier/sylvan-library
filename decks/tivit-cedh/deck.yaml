slug: tivit-cedh
name: Tivit, Seller of Secrets — Esper cEDH
status: theoretical  # theoretical: a list, not a box of cards
commander:
  - Tivit, Seller of Secrets
bracket: 5

strategy: >
  Esper midrange-control at cEDH speed. Fast mana plus free interaction plus
  hard tutors, protect a window, then win with a compact two-card combo. Tivit
  himself is a value engine you cast when the coast is clear, not a
  prerequisite — two of the three win lines do not need him on the battlefield
  at all. What makes him worth the six mana is that you vote twice on your own
  council's dilemma, so in a four-player pod every trigger is exactly five
  artifacts and opponents choose only the flavour, never the count.

notes:
  commander_why: >
    Two clauses drive everything. You vote an additional time, so a
    three-opponent pod means five votes and five artifacts per trigger that
    opponents cannot deny you. And the trigger is ETB OR combat damage, not
    "attacks" — which is why a single blocker or a fog turns off the Time Sieve
    loop and why combat has to be planned around it.
  gameplan: >
    Turns 1-2 land, rock, engine — Rhystic Study and especially Mystic Remora
    down as early as possible, since Remora's value curve collapses after turn
    four. Turn 3-4 either deploy Tivit with a counter held up or hold
    everything and answer the pod's fastest deck. Then win off Oracle, the
    Sieve loop, or the Kitten line.
  mulligan: >
    Keep hands that do TWO of these three: produce fast mana, interact for
    free, or dig. Two lands + a rock + a tutor is a keep; three lands with no
    acceleration or interaction is not — ship it, this deck functions on five.
    Auto-keeps: Gemstone Caverns on the draw, Ancient Tomb plus two rocks, or
    Wishclaw plus protection. You do not need Tivit in your opener; you need
    mana and answers. Note this policy is hand-quality based and is NOT what
    Tier 1's land-count mulligan models — do not quote sim mulligan rates for
    this deck as if they described this rule.
  curve_plan: >
    TODO — recount from the corpus, not by hand.
  pitfalls: >
    (1) The Time Sieve loop needs FIVE artifacts per iteration and you only get
    five votes with three living opponents — kill someone and the loop breaks
    at four unless Lotho, Smothering Tithe, an Urza's Saga Construct or a
    leftover Clue bridges the gap. Sequence eliminations LAST. (2) Grafdigger's
    Cage turns off your own Sevinne's Reclamation flashback. (3) Cursed Totem
    shuts off Ranger-Captain's own sacrifice ability, though it does not touch
    Tivit, Time Sieve, Clues, Treasures or the Oracle trigger.
  engine_detail: >
    Tainted Pact works only because the deck runs exactly one copy of each
    basic name — one Island, one Swamp, no duplicate names anywhere — so the
    library exiles fully. Four free counters (Force of Will, Force of Negation,
    Fierce Guardianship, Pact of Negation) is the number that lets you tap out
    for Tivit and still hold the table.
  lines: >
    Crack Wishclaw Talisman only when you can win on the spot, or when the next
    player is dead before untapping. Hold Swan Song and An Offer for the win
    attempt, not for a Rhystic Study. Ward {3} means opponents need real mana
    to kill Tivit, so often you simply let a removal spell resolve and rebuild
    rather than spend a free counter. Infinite turns is a soft lock, not a
    kill — use the turns to crack Clues, dig, and assemble Oracle.
  wincons: >
    (1) Thassa's Oracle plus Demonic Consultation or Tainted Pact — two cards,
    four mana, instant speed, and the default plan. (2) Time Sieve plus Tivit
    for infinite turns. (3) Displacer Kitten plus Teferi, Time Raveler plus any
    mana-positive artifact to draw the deck, then Oracle; Teferi's static locks
    opponents to sorcery speed while you go off.
  manabase: >
    30 lands, deliberately low, leaning on 13 fast mana pieces. All three
    Talismans are here because Tivit costs {3}{W}{U}{B} — coloured sources, not
    raw mana, are the bottleneck. One Island and one Swamp only, both to stay
    fetchable under Blood Moon effects and to keep Tainted Pact live. Reserved
    List is ALLOWED here but only three cards use it (Tundra, Underground Sea,
    Scrubland); the surveil-land substitutions cost little.
  matchups: >
    TODO — needs Tier 2. Known shape: loses to decks that go under it, grinds
    out anything slower.
  politics: >
    Opponents will sometimes vote to deny you Treasures; it does not matter,
    every vote is still an artifact and Time Sieve does not care which kind.
    Announce both your votes at once — you vote first, so everyone else has
    full information. That is the tradeoff for voting twice.
  failure_modes: >
    Casting Tivit into an open blue player with nothing held back is how this
    deck loses. Consultation lines lose to a single Flusterstorm; do not jam
    without cover unless the table is tapped out.
  swap_philosophy: >
    Ten flex slots, each naming what it replaces. Academy Manufactor turns each
    trigger into 15 artifacts but is dead on its own. The Underworld Breach
    package adds a third win but wants a more storm-focused shell.
  rules_corners: >
    Voice of Victory is legal in Esper: its Warrior tokens are red, but the
    card has no red mana symbols, so its colour identity is white only. Mana
    Crypt and Jeweled Lotus are banned as of the September 2024 update — do not
    go looking for them. Imposter Mech copies a creature as a NONCREATURE
    Vehicle, so it dodges creature removal and wraths and still counts for Mox
    Opal and Time Sieve.

