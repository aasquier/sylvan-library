    category: land
    qty: 8
    why: Green sources for {G}{G}, and the targets Nature's Lore and Cultivate want.
  - name: Plains
    category: land
    qty: 9
    why: White is the heavier half of the curve, with {W}{W} costs throughout the anthems and finishers.
