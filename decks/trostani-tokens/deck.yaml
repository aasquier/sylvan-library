    why: GW bounce land, two mana per turn. Replaced Fountainport, also colourless-only.
  - name: Sunpetal Grove
    category: land
    why: Untapped with a Forest or Plains out.
  - name: Canopy Vista
    category: land
    why: GW battle land.
  - name: Wooded Bastion
    category: land
    why: Filter land — needs another source first, then fixes exactly.
  - name: Branchloft Pathway
    category: land
    why: Choose green or white on play; always untapped.
  - name: Lush Portico
    category: land
    why: GW surveil land.
  # Utility (6)
  - name: Yavimaya, Cradle of Growth
    category: land
    why: Makes every land a Forest; huge fixing for the {G}{G} half of the commander.
  - name: Castle Ardenvale
    category: land
    why: Makes 1/1 Humans as a mana sink.
  - name: Minas Tirith
    category: land
    why: Draw engine, and it enters untapped because Trostani is legendary.
  - name: The Shire
    category: land
