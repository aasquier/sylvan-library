slug: arahbo-cats
name: Arahbo, Roar of the World — Cats
commander:
  - Arahbo, Roar of the World
companion: Kaheera, the Orphanguard
bracket: 3

strategy: >
  Selesnya cats-only aggro in two phases. Arahbo has two abilities in two
  different zones: eminence (+3/+3 to another target Cat at the beginning of
  combat) works from the command zone and is free from turn one, while the
  {1}{G}{W} power-doubling-plus-trample is a separate triggered ability that
  fires whenever another Cat you control ATTACKS, and only functions with
  Arahbo on the battlefield — it is NOT an eminence ability. So turns 1-4 are a
  free-anthem aggro deck leaning on double strike and permanent counters, and
  from turn 5 onward each attacking Cat offers its own {1}{G}{W} trigger, so
  six mana doubles two attackers, not one. Three kill routes: the doubled
  trample carrier, a
  wide alpha strike, or Felidar Sovereign at 40+ life. The last two work
  without Arahbo on the battlefield, which matters because he costs 7 to
  recast.

notes:
  commander_why: >
    Every creature in the deck is a Cat, which buys Kaheera as a free companion
    and turns Arahbo's eminence into a turn-one anthem that no removal can
    answer. The doubling ability is the payoff, not the plan — the deck has to
    function for four turns before it ever sees it.
  gameplan: >
    Phase 1 (turns 1-4): deploy cheap Cats, attack with one of them under
    eminence, and convert the temporary +3/+3 into permanent counters with
    Sovereign Okinec Ahau or Gavony Township. Phase 2 (turn 5+): land Arahbo,
    then hold three mana every combat to double a carrier with evasion or
    double strike.
  mulligan: >
    Keep 2-5 lands. Do not demand mana pieces on top of that. From a Tier 1
    policy sweep at 20,000 games each: keep 2-5 lands mulligans 21.6% and puts
    Arahbo down by T5 in 57.2% of games. Adding "lands + ramp(mv<=2) >= 3"
    nearly doubles the mulligan rate to 41.0% and buys 2.9 points of
    commander-by-T5 (57.2% to 60.1%) — a bad trade. Demanding three lands is
    worse: 51.1% mulligans for 64.3%. Median commander turn is 5 under every
    policy tested, and never-cast-by-T12 never exceeds 3%. Caveat: Tier 1
    measures mana and deployment only, not card quality — a two-lander of pure
    five-drops is still a mulligan by judgement.
  curve_plan: >
    63 nonlands at 9 / 13 / 20 / 13 / 4 / 4 across MV 1-6, average nonland MV
    3.03, counted from the corpus rather than by hand. The mass sits at three
    because eminence rewards having a body
    on the board every turn from turn one, and because the deck wants three
    mana spare from turn five onward.
  pitfalls: >
    (1) Arahbo's doubling is not eminence — it does nothing from the command
    zone. (2) Tokens that enter the battlefield already attacking (Leonin
    Warleader, Nacatl War-Pride) never trigger the doubling: the trigger is
    "whenever another Cat you control attacks", and a token put onto the
    battlefield attacking was never declared as an attacker. (3) Neither of
    Arahbo's abilities can target himself — eminence says "another target Cat"
    and the doubling says "another Cat you control", so a lone Arahbo swinging
    is a vanilla 5/5. (4) Cavern of Souls naming Cat makes only colored mana for Cat
    spells; it produces {C} for the 36 noncreature cards, and it does not help
    cast True Conviction's {3}{W}{W}{W}.
  engine_detail: >
    Sovereign Okinec Ahau is the card that makes Phase 1 real: his attack
    trigger converts every temporary pump into permanent +1/+1 counters,
    including eminence's +3/+3 from the command zone. Order him after Arahbo's
    doubling and a 1/1 keeps 7 counters. Skullclamp on 1/1 Cat tokens is the
    card-advantage engine underneath everything.
  lines: >
    Equip Hammer of Nazahn to Arahbo himself — he is the card the deck can
    least afford to lose. Double strike carriers count the doubled number
    twice, so Adorned Pouncer under eminence and a doubling is 16 damage.
    Mirri, Weatherlight Duelist restricting each opponent to one blocker is
    what a single doubled trampler needs.
  wincons: >
    A doubled trample carrier (often through Rogue's Passage), a wide alpha
    strike behind Jazal Goldmane or Beastmaster Ascension, or Felidar Sovereign
    at 40+ life fed by the deck's lifelink.
  manabase: >
    36 lands with 16 basics. A 30-40 sweep at 25,000 games per count does NOT
    identify a peak: spells deployed through T8 sits between 8.42 and 8.48
    across the entire range, flat to within noise, so the usual "find where
    deployment plateaus" rule cannot discriminate. What moves is monotonic in
    both directions — commander-by-T5 climbs 53.8% to 69.2%, wasted mana
    through T8 climbs 6.69 to 8.45, mulligans fall 48.5% to 33.2%. 36 is
    therefore a judgement call inside a broad flat optimum, and 37-38 is
    defensible. Important caveat specific to this deck: Tier 1 counts unspent
    mana as waste, but holding {1}{G}{W} open every combat IS the Phase 2 plan,
    and Gavony Township and Jazal Goldmane are real sinks it does not model —
    so the flood penalty is overstated here more than for most decks.
    Colour requirements are lopsided: 48 white pips across 38 cards against 27
    white sources (0.56 sources/pip) versus 30 green pips against 26 sources.
    True Conviction's {3}{W}{W}{W} is the hardest cost in the deck, and Cavern
    of Souls does not help cast it.
  matchups: >
    TODO — needs Tier 2.
  politics: >
    A tribal cats deck reads as durdle until the first doubled double-striker
    connects. Expect to be left alone through Phase 1 and focused the moment
    Arahbo resolves.
  failure_modes: >
    Arahbo eating removal twice and the commander tax pricing him out, or
    drawing the top of the curve without the ramp. Both are why Swiftfoot
    Boots, Teferi's Protection and Akroma's Will are in the list.
  swap_philosophy: >
    Command Beacon comes in if Arahbo keeps dying. Doubling Season goes back in
    if the pod is slow enough that a five-mana do-nothing is affordable.
  rules_corners: >
    Ajani, Nacatl Pariah is illegal here — the back face Ajani, Nacatl Avenger
    carries a colour indicator making him white AND red, so his identity is R/W
    and outside Selesnya. Eladamri's Call cannot find Arahbo; he is in the
    command zone, not the library. Loam Lion's Forest condition is almost never
    live on turn one — Temple Garden is the only land that is both a Forest and
    a white source.

cards:
  # ------------------------------------------------------------- LANDS 36
  # Basics (16)
  - name: Plains
    category: land
    qty: 9
    why: >
      White is the heavier requirement — {W}{W} on Felidar Sovereign, Balan's
      equip, Regal Caracal. Also fuel for Oreskos Explorer and Krosan Verge.
  - name: Forest
    category: land
    qty: 7
    why: >
      Green is needed for the {G} in every activation and for Nature's Lore,
      Three Visits and Skyshroud Claim to have targets.
  # Untapped colour sources (12)
  - name: Command Tower
    category: land
    why: Perfect untapped dual.
  - name: Temple Garden
    category: land
    why: Untapped for 2 life; Forest+Plains types make it a Nature's Lore and fetch target.
  - name: Sunpetal Grove
    category: land
    why: Checkland — untapped from turn 2 with 16 basics.
  - name: Razorverge Thicket
    category: land
    why: Fastland — untapped exactly when the cheap-Cat curve needs it.
  - name: Bountiful Promenade
    category: land
    why: Untapped in any multiplayer pod.
  - name: Hushwood Verge
    category: land
    why: Untapped, green immediately, white with a Plains out.
  - name: Branchloft Pathway
    category: land
    why: Modal — you choose which half the hand needs, always untapped.
  - name: Windswept Heath
    category: land
    why: Fetches Forest or Plains; fixes and thins.
  - name: Wooded Bastion
    category: land
    why: Filter land — turns one coloured source into the exact {G}{W} an activation needs.
  - name: Brushland
    category: land
    why: Untapped both colours for 1 life; you have 40 to spend.
  - name: Fortified Village
    category: land
    why: Untapped if you reveal a Forest; effectively a dual in a 16-basic deck.
  - name: Cavern of Souls
    category: land
    why: >
      Enters untapped. Name Cat: your Cats — including Arahbo himself — can't be
      countered, and it fixes for all 27 creatures. Cost: it only makes {C} for
      your 36 noncreature cards. Worth it to stop a counterspell on a commander
      that costs 7 to recast.
  # Conditional or tapped (5)
  - name: Canopy Vista
    category: land
    why: Untapped with 2+ basics, which is most games by turn 3.
  - name: Overgrown Farmland
    category: land
    why: Slowland — a real dual from turn 3 onward.
  - name: Lush Portico
    category: land
    why: Surveil 1 smooths draws; tapped lands are acceptable on turns you aren't activating.
  - name: Krosan Verge
    category: land
    why: Fetches Forest AND Plains — two lands for one card, and both are dual-typed targets.
  - name: Path of Ancestry
    category: land
    why: >
      Scry 1 every time it pays for a Cat. Arahbo is a Cat Avatar, so
      effectively every creature in the deck scries.
  # Utility (3)
  - name: Yavimaya, Cradle of Growth
    category: land
    why: >
      Makes every land a Forest — your Plains now produce {G} for activations.
      Quietly the best fixer in the deck.
  - name: Gavony Township
    category: land
    why: Mana sink that makes counters permanent, which is what this deck lacks.
  - name: Rogue's Passage
    category: land
    why: The unblockable button. A doubled Cat that can't be blocked ends a player.

  # -------------------------------------------------------------- RAMP 7
  - name: Sol Ring
    category: ramp
    why: >
      Free two mana. Gets Arahbo down a turn early, then pays for most of a
      doubling every turn after.
  - name: Arcane Signet
    category: ramp
    why: Any colour, turn-2 play into a turn-3 activation.
  - name: Selesnya Signet
    category: ramp
    why: Filters into exactly {G}{W}, which is the hardest part of the activation cost.
  - name: Nature's Lore
    category: ramp
    why: Untapped dual, no basic restriction — grabs Temple Garden or Canopy Vista.
  - name: Three Visits
    category: ramp
    why: Functional Nature's Lore #2.
  - name: Cultivate
    category: ramp
    why: Fixes both colours and guarantees the land drop next turn.
  - name: Skyshroud Claim
    category: ramp
    why: Two untapped duals — a full extra activation the turn it resolves.

  # ------------------------------------------------------------- CATS 27
  # One mana (3)
  - name: Ocelot Pride
    category: threat
    why: >
      One mana, and every turn you gained life it adds another Cat token. Under
      eminence a 1/1 attacks as a 4/4, or 8/8 doubled.
  - name: Sacred Cat
    category: threat
    why: Lifelink body plus an embalm token later — two Cats from one card.
  - name: Loam Lion
    category: threat
    why: >
      1/1 base, 2/3 while you control a Forest. Base power 2 doubles to 10
      where a 1/1 doubles to 8. The most replaceable card in the deck.
  # Two mana (5)
  - name: Adorned Pouncer
    category: threat
    why: >
      The best rate in the deck: double strike means the doubled number gets
      counted twice. 4/4 after eminence, 8/8 doubled, 16 damage.
  - name: Qasali Pridemage
    category: interaction
    why: Exalted rewards the solo attack the deck naturally makes, and it is stapled artifact/enchantment removal.
  - name: Oreskos Explorer
    category: ramp
    why: Fixes and hits the land drop while being a Cat body for the count.
  - name: Fleecemane Lion
    category: threat
    why: 3/3 for two, and monstrosity gives hexproof + indestructible — protection for whatever is carrying the swing.
  - name: Bronzehide Lion
    category: threat
    why: 4/4 for two, {G}{W} for indestructible, and it comes back as an Aura when it dies. Answers removal twice.
  # Three mana (8)
  - name: Arahbo, the First Fang
    category: engine
    why: >
      Anthem plus a Cat token on every nontoken Cat ETB — token count, Qasali
      Slingers triggers, and Skullclamp fodder in one card.
  - name: Brimaz, King of Oreskos
    category: threat
    why: Makes a token whenever it attacks or blocks; vigilance means it defends while attacking.
  - name: Kutzil, Malamet Exemplar
    category: threat
    why: Two-colour-efficient Cat with real stats for the cost.
  - name: King of the Pride
    category: threat
    why: Other Cats get +2/+1. Every anthem point is doubled by the activation and banked by Okinec Ahau.
  - name: Balan, Wandering Knight
    category: threat
    why: >
      3/3 first strike; double strike while two or more Equipment are attached,
      and {1}{W} attaches your whole Equipment stack to him at instant speed. A
      three-mana double-striker is a premier doubling target.
  - name: Mirri, Weatherlight Duelist
    category: threat
    why: >
      Your best evasion card. When she attacks, each opponent can't block with
      more than one creature — exactly what a single doubled trampler needs.
      While tapped, no more than one creature can attack you.
  - name: Feline Sovereign
    category: threat
    why: >
      {2}{G} 2/3 lord: other Cats get +1/+1 and protection from Dogs, and
      whenever your Cats connect, destroy an artifact or enchantment. Note it
      does NOT grant trample — your only trample is Arahbo's activation.
  - name: Pride Sovereign
    category: threat
    why: >
      Grows with every other Cat, and exerts to make two lifelink Cat tokens —
      bodies, lifegain for Felidar Sovereign, and Skullclamp fodder.
  # Four mana (4)
  - name: Armored Skyhunter
    category: threat
    why: Flying evasion that digs six cards deep for an Equipment and attaches it, every attack.
  - name: Bast, Panther Goddess
    category: threat
    why: Indestructible, trample, reach; pumps an attacker by your creature count on top of eminence. Survives wraths.
  - name: Jazal Goldmane
    category: win-con
    why: 4/4 first strike; {3}{W}{W} pumps all attackers by the number of attackers. Expensive to activate, but it is the wide finisher.
  - name: Sovereign Okinec Ahau
    category: engine
    why: >
      The engine card, and the answer to the turns before Arahbo lands. His
      attack trigger converts every temporary pump into permanent +1/+1
      counters — including eminence's +3/+3, which works from the command zone.
      Ward {2} protects him.
  # Five mana (5)
  - name: Keeper of Fables
    category: card-advantage
    why: Draws a card whenever your non-Human creatures connect — every Cat qualifies.
  - name: Leonin Warleader
    category: threat
    why: Two attacking Cat tokens every attack. Tokens that enter attacking do NOT trigger Arahbo's doubling.
  - name: Nazahn, Revered Bladesmith
    category: tutor
    why: Tutors Hammer of Nazahn on ETB and taps a blocker every attack.
  - name: Regal Caracal
    category: threat
    why: Three lifelink Cat bodies in one card — token count, Felidar Sovereign fuel, and three Qasali Slingers triggers.
  - name: Qasali Slingers
    category: interaction
    why: >
      Reach body that destroys an artifact or enchantment on every Cat ETB.
      With Regal Caracal or Arahbo the First Fang this dismantles a table.
  # Six mana (2)
  - name: Nacatl War-Pride
    category: threat
    why: Makes a Cat token for each creature the defender controls, and they must all be blocked. A board-breaker, not a clunker.
  - name: Felidar Sovereign
    category: win-con
    why: >
      The alternate win condition: at your upkeep, if you have 40 or more life,
      you win. You start at 40, and the deck has lifelink everywhere.

  # -------------------------------------------------------- EQUIPMENT 7
  - name: Basilisk Collar
    category: payoff
    why: >
      One to cast, one to equip — the only equip cost that doesn't compete with
      the {1}{G}{W} activation. Lifelink on a doubled carrier is the Felidar
      Sovereign engine. Deathtouch plus trample means you assign 1 to each
      blocker and the rest goes through, which answers chump blocking.
  - name: Skullclamp
    category: card-advantage
    why: Your Cat tokens are 1/1s. Equip 1, draw two, repeat. The deck's best card-advantage engine by a wide margin.
  - name: Swiftfoot Boots
    category: protection
    why: >
      Hexproof and haste, equip 1. Arahbo costs 7 to recast and isn't reliably
      replaceable until turn 8 — the cheapest insurance in the format.
  - name: Sword of Fire and Ice
    category: protection
    why: Protection from red and blue dodges removal and counters; value on connect.
  - name: Sword of Light and Shadow
    category: protection
    why: Protection from white and black dodges Swords to Plowshares, wraths, and edicts.
  - name: Hammer of Nazahn
    category: protection
    why: Auto-attaches and makes the equipped creature indestructible. Worth equipping to Arahbo himself.
  - name: Leyline Axe
    category: threat
    why: Free from the opening hand; double strike + trample doubles the doubled number.

  # ------------------------------------------------- ENGINES & PAYOFFS 14
  - name: Sigarda's Aid
    category: engine
    why: Flash in Equipment and auto-attach it — a combat trick with nine Equipment-adjacent cards.
  - name: Herald's Horn
    category: ramp
    why: >
      Arahbo is a Cat Avatar, so the Horn makes your commander cost 4 — the
      single best way to reach Phase 2 a turn early. Also digs a Cat off the
      top each upkeep.
  - name: Mirari's Wake
    category: engine
    why: >
      Doubles all your land mana and anthems the team. With Arahbo down,
      doubled mana is doubled activations; before that, it is how you cast him
      plus a threat in one turn.
  - name: Beastmaster Ascension
    category: win-con
    why: Two mana; after seven attack triggers everything gets +5/+5. A wide board fills it in two turns.
  - name: Esika's Chariot
    category: engine
    why: Two Cat tokens, copies a token every attack, and crews itself with your spare bodies.
  - name: Felidar Retreat
    category: engine
    why: Every land drop is a 2/2 Cat or a counter on everything. Counters are permanent.
  - name: Duelist's Heritage
    category: payoff
    why: Double strike on an attacker of your choice every combat. Critical in Phase 1, when it is the only damage multiplier you have.
  - name: True Conviction
    category: win-con
    why: >
      Team double strike and lifelink, and it needs Arahbo nowhere. Your best
      card when the commander keeps getting removed, and it fills the Felidar
      Sovereign clock. Note {3}{W}{W}{W} — triple white is the deck's most
      demanding cost against roughly 25 white sources, and Cavern of Souls
      doesn't help since it only makes coloured mana for Cat spells.
  - name: Tocasia's Welcome
    category: card-advantage
    why: Draws on your cheap Cats and tokens entering; the curve is built to turn this on.
  - name: Tribute to the World Tree
    category: card-advantage
    why: Counters on the small Cats, cards off the big ones. Refuels after a wrath.
  - name: Aura Shards
    category: interaction
    why: With 30 creatures plus tokens, every Cat that lands blows up a permanent.
  - name: Sheltered by Ghosts
    category: interaction
    why: Two-mana removal that also gives the carrier lifelink and ward.
  - name: Ajani, Strength of the Pride
    category: payoff
    why: >
      Gains life equal to creatures plus artifacts — often 10+ in one
      activation, which is the Felidar Sovereign button. Also makes Cat tokens.
  - name: Ajani, Caller of the Pride
    category: payoff
    why: >
      −3 grants flying AND double strike — a damage multiplier that works in
      Phase 1 when Arahbo's doubling doesn't. Enters at 4 loyalty, so it fires
      immediately and again later.

  # ------------------------------------------ INTERACTION & TUTORS 8
  - name: Swords to Plowshares
    category: interaction
    why: One mana, exiles anything. You had four interaction spells in a 100-card format.
  - name: Beast Within
    category: interaction
    why: Instant-speed answer to literally any permanent.
  - name: Generous Gift
    category: interaction
    why: Same flexibility in white; both are worth the 3/3 downside.
  - name: Heroic Intervention
    category: protection
    why: Protects the whole board from a wrath or the carrier from spot removal, for two mana.
  - name: Enlightened Tutor
    category: tutor
    why: Finds Skullclamp, Aura Shards, Mirari's Wake, or Hammer of Nazahn depending on the game.
  - name: Eladamri's Call
    category: tutor
    why: >
      {G}{W} instant: search for a creature card and put it into your hand.
      Finds Felidar Sovereign near 40, Okinec Ahau for the counter engine,
      Mirri for the kill to connect, or Regal Caracal to rebuild. It cannot
      find Arahbo — he is in the command zone, not the library.
  - name: Akroma's Will
    category: protection
    why: >
      {3}{W} instant. Choose one — or both if you control a commander. With
      Arahbo on the battlefield it is simultaneously a fog, a wrath-proof, and
      lethal: protection from each colour means coloured blockers can't block.
  - name: Teferi's Protection
    category: protection
    why: >
      Phases out everything you own and makes you untouchable until your next
      turn. The answer to a board wipe, a lethal swing back, or removal on
      Arahbo mid-combat.

swap_board:
  - name: Command Beacon
    category: land
    why: Returns Arahbo from the command zone to your hand, resetting commander tax to zero. Take it over Gavony Township if he keeps dying.
  - name: Flawless Maneuver
    category: protection
    why: Free protection spell while you control your commander — the budget third protection slot.
  - name: Ajani, the Greathearted
    category: payoff
    why: Team vigilance plus a repeatable counter spread. Slower than the other two Ajanis.
  - name: Hungry Lynx
    category: threat
    why: More Cat density if the tribal count needs it.
  - name: Lion Sash
    category: threat
    why: Cat Equipment with graveyard hate stapled on.
  - name: Skyhunter Skirmisher
    category: threat
    why: Flying double strike — a natural doubling carrier.
  - name: Alms Collector
    category: card-advantage
    why: Punishes mass-draw decks while being a Cat body.
  - name: Temur Sabertooth
    category: protection
    why: Saves a Cat from removal and rebuys ETBs.
  - name: Return of the Wildspeaker
    category: card-advantage
    why: Instant-speed draw-a-lot off a big Cat, or a team pump.
  - name: Doubling Season
    category: engine
    why: Cut for tempo, not power. Put it back if your pod is slow.
