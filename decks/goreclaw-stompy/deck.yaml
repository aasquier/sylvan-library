slug: goreclaw-stompy
name: Goreclaw, Terror of Qal Sisma — Mono-Green Stompy
status: theoretical  # theoretical: a list, not a box of cards
commander:
  - Goreclaw, Terror of Qal Sisma
bracket: 4

strategy: >
  Mono-green big stompy that abuses all three of Goreclaw's lines at once.
  Creature spells with power 4+ cost {2} less, so the deck plays almost nothing
  that is not power 4+ and can deploy two haymakers where other decks deploy
  one. When Goreclaw attacks he untaps every power-4+ creature you control and
  gives them +1/+1 and trample — effectively free vigilance for the whole
  board, which removes the crackback that normally punishes stompy. And he is a
  4/6, so he survives damage-based removal and blocks while you set up. Get to
  six mana on turn 3-4, resolve Goreclaw, then deploy threat density nobody can
  answer.

notes:
  commander_why: >
    The discount and the untap are two different kinds of advantage stacked on
    one four-drop: one lets you double-spell, the other lets you attack without
    tapping out defensively. A 4/6 body means he does not die to the damage
    removal that answers most green four-drops.
  gameplan: >
    Ramp hard on turns 1-3 (eight ramp pieces come down on turn 1 or 2), land
    Goreclaw turn 3-4, then chain discounted fatties. You are not assembling a
    combo; you are deploying more power than the table can block, then breaking
    the board open with an overrun effect.
  mulligan: >
    TODO — derive from a Tier 1 sweep, do not guess.
  curve_plan: >
    TODO — recount from the corpus, not by hand.
  pitfalls: >
    (1) City of Solitude is symmetric — it turns off your own Heroic
    Intervention, Veil of Summer, Vines, Chord, Sylvan Safekeeper and Yavimaya
    Hollow on opponents' turns, so a sorcery-speed wrath on their turn resolves
    clean. It protects your kill turn, not your board. (2) Bane of Progress and
    similar sweepers kill your own Great Henge, Survival and Asceticism. (3)
    Steel Leaf Champion and Gigantosaurus have no generic mana in their costs,
    so Goreclaw's discount does nothing for them — that is why they are not
    here.
  engine_detail: >
    Survival of the Fittest is the consistency engine: every dead fatty in hand
    becomes the exact one the game wants, and Fauna Shaman is the redundancy.
    The Great Henge costs {G}{G} with a 7-power creature out and then ramps,
    gains, draws and puts counters down every turn.
  lines: >
    Natural Order sacrificing a mana dork puts Craterhoof onto the battlefield
    — the fastest kill in the deck. Defense of the Heart fetches two, so
    Craterhoof plus Vorinclex ends it outright. Concordant Crossroads converts
    every cheated-in fatty from "pass and hope" into immediate lethal. Ohran
    Frostfang plus any trample source makes the board mathematically
    unblockable, since each attacker assigns 1 to each blocker and the rest
    tramples through.
  wincons: >
    Five independent routes: Craterhoof / End-Raze / Overwhelming Stampede
    alpha strikes, Biorhythm, Finale of Devastation for X>=10, Genesis Wave
    into a board, and Squall Line to the face. The one optional infinite is
    Selvala, Heart of the Wilds plus Umbral Mantle for infinite green mana —
    cut Umbral Mantle for Snakeskin Veil to run zero combos.
  manabase: >
    TODO — 34 lands inherited from the source, not yet confirmed by a sweep.
  matchups: >
    TODO — needs Tier 2. Known shape: a fair Bracket 4 that wins through combat
    math rather than a mana engine, so it loses to tuned Bracket 4 combo more
    often than it beats it.
  politics: >
    You are visibly the biggest board at the table from turn four. There is no
    hiding this deck; play for the pod to be unable to profitably attack you
    rather than for them to ignore you.
  failure_modes: >
    Drawing threats without ramp, or getting the board answered by a wrath
    while City of Solitude stops you responding. Eight protection slots exist
    because a stompy deck must overextend.
  swap_philosophy: >
    A rotation board rather than a sideboard — each entry names the exact card
    it replaces. Blossoming Defense in for City of Solitude in wrath-heavy
    pods; Bane of Progress in for Regal Force against artifacts, remembering it
    eats your own Henge.
  rules_corners: >
    Yavimaya, Cradle of Growth is deliberately excluded: it makes opponents'
    lands Forests too, which under Vernal Bloom would hand the whole table
    doubled mana. Yavimaya Hollow's regeneration beats destroy effects and
    combat damage but not exile, sacrifice, or -X/-X. Reserved List is ALLOWED
    in this deck — Survival of the Fittest, Yavimaya Hollow, Vernal Bloom and
    City of Solitude are all intentional. Gaea's Cradle is excluded by
    standing rule.

cards:
  # -------------------------------------------------------------- LANDS 34
  - name: Forest
    category: land
    qty: 25
    why: >
      {G}{G} is needed constantly, Arbor Elf / Utopia Sprawl / Wild Growth key
      off Forests specifically, and every one of these doubles under Vernal
      Bloom.
  - name: Nykthos, Shrine to Nyx
    category: land
    why: >
      Mono-green devotion is absurd here — Goreclaw {G}{G}, Vorinclex
      {G}{G}{G}, Vigor {G}{G}{G}, Nylea {G}. Routinely taps for 5-8.
  - name: Deserted Temple
    category: land
    why: Untaps Nykthos. Doubles your best land, and most mono-green lists forget it.
  - name: Castle Garenbrig
    category: land
    why: Adds six mana for creature spells. With the discount, that is a Craterhoof from nowhere.
  - name: Boseiju, Who Endures
    category: land
    why: Channel from hand for artifact / enchantment / nonbasic removal. Interaction that never rots as a dead draw.
  - name: Homeward Path
    category: land
    why: Pure protection. Answers Control Magic, Agent of Treachery, Gilded Drake — anything that steals your fatty.
  - name: Yavimaya Hollow
    category: land
    why: >
      {G}, {T}: regenerate target creature. Repeatable protection from a land,
      every turn, costing no card. Beats destroy and combat damage; not exile,
      sacrifice, or -X/-X.
  - name: Mosswort Bridge
    category: land
    why: Hideaway. Your board hits 10 total power by turn 4, so this is a free spell off the top.
  - name: Bonders' Enclave
    category: land
    why: A draw engine that only works in a deck with power-4+ creatures. That is this deck.
  - name: Dryad Arbor
    category: land
    why: >
      A Forest that is also a creature: fetchable off Nature's Lore, and Green
      Sun's Zenith for X=0 is a one-mana ramp spell. Also Natural Order fodder.

  # --------------------------------------------------------------- RAMP 14
  - name: Sol Ring
    category: ramp
    why: It is Sol Ring. Notably not a Game Changer, so it costs nothing bracket-wise.
  - name: Utopia Sprawl
    category: ramp
    why: One-mana ramp on turn 1, and the Arbor Elf half of the best turn 2 in mono-green.
  - name: Wild Growth
    category: ramp
    why: Same engine, second copy in function.
  - name: Arbor Elf
    category: ramp
    why: Untaps an enchanted Forest for net +2. With Sprawl that is four mana on turn 2.
  - name: Llanowar Elves
    category: ramp
    why: Turn-1 dork.
  - name: Sakura-Tribe Elder
    category: ramp
    why: Ramps and eats an early attack.
  - name: Nature's Lore
    category: ramp
    why: Untapped Forest — and it can grab Dryad Arbor.
  - name: Three Visits
    category: ramp
    why: Same card, second copy.
  - name: Skyshroud Claim
    category: ramp
    why: Two untapped Forests. Best four-mana ramp in the colour.
  - name: Vernal Bloom
    category: ramp
    why: >
      Every Forest taps for an extra {G} — with 25 Forests plus Dryad Arbor
      this roughly doubles your land mana. Symmetric, but only green decks
      benefit, and Yavimaya Cradle of Growth is excluded so opponents' lands
      stay non-Forests.
  - name: Karametra's Acolyte
    category: ramp
    why: Devotion mana. In a deck this green-heavy she taps for 4-7.
  - name: Selvala, Heart of the Wilds
    category: ramp
    why: >
      A turn-7 card in the 99 rather than a turn-3 lightning rod in the command
      zone. Taps for your biggest creature's power and draws on every
      escalating threat.
  - name: Nyxbloom Ancient
    category: ramp
    why: Triples all your mana, on a 5/5 trample body discounted to {3}{G}{G}. With Nykthos this ends games.
  - name: Seedborn Muse
    category: ramp
    why: Untap everything on every opponent's turn. Note the tension with City of Solitude.

  # ----------------------------------------------------- CARD ADVANTAGE 9
  - name: The Great Henge
    category: card-advantage
    why: >
      Costs {G}{G} with a 7-power creature out. Ramps, gains life, draws a card
      plus a counter on every creature. Best card in the deck after Survival.
  - name: Garruk's Uprising
    category: card-advantage
    why: Draws on every power-4+ creature entering, and grants the team trample.
  - name: Guardian Project
    category: card-advantage
    why: Singleton deck means it triggers on essentially every creature.
  - name: Beast Whisperer
    category: card-advantage
    why: Draws on cast, not ETB — still pays you when the fatty gets countered or killed on the stack.
  - name: Return of the Wildspeaker
    category: card-advantage
    why: Instant. Draws equal to greatest power, routinely 7-12. Or a surprise +3/+3 team pump for lethal.
  - name: Rishkar's Expertise
    category: card-advantage
    why: Draw ~8, then cast a free five-drop.
  - name: Sylvan Library
    category: card-advantage
    why: Selection every turn, a real draw-3 when you need to close. Not Reserved List.
  - name: Greater Good
    category: card-advantage
    why: >
      Removal insurance — in response to targeted removal, sac the fatty and
      draw 8.
  - name: Ohran Frostfang
    category: card-advantage
    why: >
      Deathtouch for the team plus a card per connection. Deathtouch + trample
      means each attacker assigns 1 to each blocker and the rest goes to face —
      the board becomes mathematically unblockable.

  # ------------------------------------------------------------- TUTORS 7
  - name: Survival of the Fittest
    category: tutor
    why: The reason this deck is consistent. Turns every dead fatty in hand into the exact one you need.
  - name: Fauna Shaman
    category: tutor
    why: Survival on a stick. Redundancy for the engine.
  - name: Worldly Tutor
    category: tutor
    why: Instant speed. Find Craterhoof end of turn, untap, kill.
  - name: Natural Order
    category: tutor
    why: Sacrifice a Llanowar Elves, put Craterhoof onto the battlefield. The fastest kill in the deck.
  - name: Green Sun's Zenith
    category: tutor
    why: X=0 for Dryad Arbor early, X=6 for Craterhoof late. Shuffles back in, so it is never truly spent.
  - name: Chord of Calling
    category: tutor
    why: Convoke means your board pays for it. Instant-speed Craterhoof is the surprise kill.
  - name: Defense of the Heart
    category: tutor
    why: >
      Two creatures from library onto the battlefield, free. Craterhoof plus
      Vorinclex ends the game on the spot. Reprinted, so not Reserved List.

  # ------------------------------------------------------------ THREATS 14
  - name: Craterhoof Behemoth
    category: win-con
    why: The kill. Haste, trample, +X/+X. Discounted to {3}{G}{G}.
  - name: End-Raze Forerunners
    category: win-con
    why: Second Craterhoof, and an 8/8 in its own right. Redundancy is how you stop losing to one removal spell.
  - name: Ghalta, Primal Hunger
    category: threat
    why: A 12/12 trample that often costs {G}{G} — his reduction stacks with Goreclaw's.
  - name: Vorinclex, Monstrous Raider
    category: threat
    why: >
      6/6 haste trample for {2}{G}{G}{G}. Doubles every counter (Great Henge,
      Goreclaw's pump) and halves opposing planeswalkers.
  - name: Terastodon
    category: threat
    why: A 9/9 that destroys three noncreature permanents. Green's artifact/enchantment problem, stapled to a haymaker.
  - name: Kogla, the Titan Ape
    category: threat
    why: 7/7 that fights on ETB — removal on a stick — and destroys an artifact or enchantment whenever he is blocked.
  - name: Carnage Tyrant
    category: threat
    why: 7/6 trample, hexproof, can't be countered. The threat you play into blue.
  - name: Vigor
    category: threat
    why: >
      Damage to your other creatures becomes +1/+1 counters. Your team cannot
      die in combat, grows every attack, and Blasphemous Act makes you bigger.
  - name: Multani, Yavimaya's Avatar
    category: threat
    why: >
      Power equal to lands in play plus lands in graveyard, often 12+, and
      returns himself for {3}{G}. Nearly impossible to answer permanently.
  - name: Primeval Titan
    category: threat
    why: 6/6 trample fetching two lands on ETB and on attack. Ramp and threat in one card.
  - name: Regal Force
    category: card-advantage
    why: 5/5 that draws for every green creature you control. Often draws 6+.
  - name: Nylea, God of the Hunt
    category: threat
    why: >
      Indestructible (survives every wrath), grants the team trample, and a
      {3}{G} mana sink. Discounted to {1}{G} — still a creature spell with
      power 6.
  - name: Silverback Elder
    category: threat
    why: >
      Modal value on every creature cast: destroy an artifact or enchantment,
      ramp, or gain 5. Solves green's blind spot without a dedicated slot.
  - name: Elder Gargaroth
    category: threat
    why: 6/6 vigilance, reach, trample, value on every attack or block. Discounted to {1}{G}{G}. Handles fliers.

  # --------------------------------------------------------- PROTECTION 8
  - name: Heroic Intervention
    category: protection
    why: The wrath answer. Hexproof and indestructible for everything, two mana.
  - name: Veil of Summer
    category: protection
    why: One mana, blanks a counterspell or removal spell and draws a card.
  - name: City of Solitude
    category: protection
    why: >
      Opponents can't cast spells or activate abilities during your turn, so
      your Craterhoof turn is uninteractive. Symmetric and expensive: it also
      turns off your own instant-speed protection on their turns. It protects
      the kill turn, not the board.
  - name: Vines of Vastwood
    category: protection
    why: Uncounterable protection from targeting, or kicked for +4/+4 as a combat blowout.
  - name: Sylvan Safekeeper
    category: protection
    why: Free, repeatable shroud, as many times per turn as you have lands.
  - name: Asceticism
    category: protection
    why: Blanket hexproof plus regeneration. Shuts off all targeted interaction permanently.
  - name: Lightning Greaves
    category: protection
    why: Haste gets Goreclaw attacking (and untapping the team) the turn he lands. Shroud is a bonus.
  - name: Yeva, Nature's Herald
    category: protection
    why: >
      Flash for all green creatures. Deploy at end of turn dodging
      sorcery-speed wraths, and ambush attackers. A 4/4 that takes the discount
      herself.

  # -------------------------------------------------------- INTERACTION 6
  - name: Beast Within
    category: interaction
    why: Green's only true "destroy any permanent." Instant, hits lands, commanders, anything.
  - name: Nature's Claim
    category: interaction
    why: One mana for any artifact or enchantment. The four life is irrelevant.
  - name: Krosan Grip
    category: interaction
    why: Split second — the only way green reliably beats a protected engine.
  - name: Song of the Dryads
    category: interaction
    why: Turns any problem permanent into a Forest. Answers commanders permanently — they do not go back to the command zone.
  - name: Ulvenwald Tracker
    category: interaction
    why: Repeatable fight. With a 12/12 out, that is a removal spell every turn.
  - name: Vivien Reid
    category: interaction
    why: Selection every turn, and a -3 that kills a flier, artifact, or enchantment. Covers green's two worst matchups in one card.

  # ------------------------------------------------------ WIN CONDITIONS 7
  - name: Concordant Crossroads
    category: win-con
    why: >
      One mana: every creature has haste. Turns Natural Order, Defense of the
      Heart, Chord and Finale into immediate lethal. Symmetric, but you are the
      one cheating creatures into play. Not Reserved List — Chronicles reprint.
  - name: Overwhelming Stampede
    category: win-con
    why: Overrun that pumps by your greatest power. With Ghalta out, +12/+12 to the team.
  - name: Biorhythm
    category: win-con
    why: >
      Everyone's life total becomes their creature count. Eight creatures to
      their two wins from 40. Also breaks a stalled board.
  - name: Finale of Devastation
    category: win-con
    why: Tutor and finisher. X=10 fetches a creature onto the battlefield and gives everything +10/+10 and haste.
  - name: Genesis Wave
    category: win-con
    why: With Vernal Bloom or Nyxbloom online, X=12 dumps most of your deck onto the battlefield.
  - name: Squall Line
    category: win-con
    why: Your reach. X to each player and every flier — sweeps what you can't block, kills a table that stabilized.
  - name: Umbral Mantle
    category: win-con
    why: >
      The one two-card combo, and it is optional. Also a fine standalone: untap
      Karametra's Acolyte or Selvala for extra mana any turn.

swap_board:
  - name: Blossoming Defense
    category: protection
    why: In for City of Solitude in a wrath- or removal-heavy pod, where you need to interact on their turn.
  - name: Berserk
    category: win-con
    why: In for Squall Line when there are no meaningful fliers. Doubles a Ghalta's power with trample for {G}. Not Reserved List.
  - name: Triumph of the Hordes
    category: win-con
    why: In for Biorhythm in a high-power lifegain pod, where 10 infect is faster than 40 real damage. Expect salt.
  - name: Bane of Progress
    category: interaction
    why: In for Regal Force against artifacts or enchantments. Kills your own Great Henge, Survival and Asceticism — play it before committing those.
  - name: Whirlwind
    category: interaction
    why: In for Ulvenwald Tracker against dedicated flier decks. Dead otherwise, which is why it is boarded.
  - name: Thrun, the Last Troll
    category: threat
    why: In for Elder Gargaroth against heavy blue. Uncounterable, hexproof, regenerating.
  - name: Constant Mists
    category: protection
    why: In for Rishkar's Expertise against fast aggro or token swarms. Buyback fog buys the three turns you need.
  - name: Rogue's Passage
    category: land
    why: In for Deserted Temple in board-stall or pillowfort pods decided by one unblockable swing.
  - name: Woodfall Primus
    category: threat
    why: In for Multani against prison and stax. Persist means two noncreature permanents die, not one.
  - name: Hall of Gemstone
    category: land
    why: >
      In for Seedborn Muse in three-plus-colour pods. Each player taps lands
      for only one colour per turn; mono-green is immune. Reserved List, and it
      makes you archenemy — use with intent.
