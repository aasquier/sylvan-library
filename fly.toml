# fly.toml app configuration file generated for sylvan-library on 2026-08-13T14:10:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sylvan-library'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  MTGLAB_ADMIN_EMAIL = 'you@example.com'
  MTGLAB_ADMIN_USERNAME = 'you'
  MTGLAB_BASE_URL = 'https://sylvan-library.fly.dev'
  MTGLAB_DATA_DIR = '/data'
  MTGLAB_DECKS_DIR = '/data/decks'
  MTGLAB_EMAIL_FROM = 'sylvan-library@example.com'
  MTGLAB_REQUIRE_AUTH = '1'

[[mounts]]
  source = 'mtglab_data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
