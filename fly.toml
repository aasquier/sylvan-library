# Fly.io deployment. `docs/HOSTING.md` §4 is the guide; this is the file.
#
# **Nothing secret belongs here.** This repository is public and CI scans every
# tracked file's contents for an API key. `RESEND_API_KEY` and
# `ANTHROPIC_API_KEY` are `fly secrets set`, never `[env]` — see §4 step 4.
#
# Fly is what §4 recommends *for the app alone*, and that recommendation is
# still open in §7: it flips to a Hetzner box if Forge ever goes server-side,
# because Forge wants ~470MB of card data, a JRE, and gigabytes of heap. This
# file is the only Fly-specific thing in the repository — the Dockerfile is
# plain OCI and runs anywhere — so switching costs this file and nothing else.

app = "sylvan-library"
primary_region = "iad"          # change to the region nearest you

[build]
  dockerfile = "Dockerfile"

[env]
  MTGLAB_DATA_DIR = "/data"

  # The volume, not `/app/decks`. `deck.yaml` is the source of truth and the
  # app's editing routes write it, so a decks directory inside the image would
  # mean every rationale written in the UI disappeared at the next deploy. The
  # image carries `/app/decks-seed`; §4 step 6 copies it here once.
  #
  # The consequence to know: this instance's decks and the repository's can now
  # diverge, and neither is automatically authoritative. §5 says how to keep
  # them in step.
  MTGLAB_DECKS_DIR = "/data/decks"

  # Auth on. The local default is off and stays off — one person on a laptop
  # does not need a login — but a shared instance is the case the whole of §1
  # was written for. With this set, `api/auth.py`'s middleware refuses every
  # path outside `PUBLIC_PATHS` before routing, and `App.tsx` renders the login
  # screen in place of the app.
  MTGLAB_REQUIRE_AUTH = "1"

  # ---- CHANGE THESE TWO BEFORE THE FIRST DEPLOY --------------------------
  #
  # Placeholders on purpose, and they are the two that stay placeholders. This
  # repository is public, and an email address is the one piece of personal
  # data the project handles — CLAUDE.md keeps it out of logs, artifacts and
  # tool results, and a tracked file is a weaker place to put it than any of
  # those. The real values live in the gitignored `.env`.
  #
  # Two ways to supply them, and the second keeps the address out of git for
  # good: edit the lines below, **or** `fly secrets set MTGLAB_ADMIN_EMAIL=...`,
  # which is injected as an environment variable and takes precedence over
  # `[env]`. Neither is a credential; the second is just a private place to put
  # configuration, and it is the one to use here.
  #
  # **A deploy with these still reading `you@example.com` creates that account
  # and not yours** — which is a real failure mode rather than a hypothetical
  # one, because the app comes up looking entirely healthy and the sign-in page
  # simply has nobody behind it who is you.

  # Who administers this instance (ADR 17). `auth/bootstrap.py` reconciles this
  # account to admin-and-enabled at every boot, creating it unclaimed if
  # absent, so a demotion or a restored backup is repaired by a restart. There
  # is deliberately no `MTGLAB_ADMIN_PASSWORD`; the account is claimed from the
  # sign-in page's reset link.
  #
  # **A deploy with this unset has nobody who can administer it.** Whoever can
  # change it is an admin on the next boot — already true of anyone who can run
  # `fly deploy`, so it grants nothing new, and every change is logged.
  MTGLAB_ADMIN_EMAIL = "you@example.com"
  MTGLAB_ADMIN_USERNAME = "you"

  # Where emailed invite and reset links point. Without it every link in every
  # message says `127.0.0.1` and nobody can claim an account, and it is never
  # derived from the request — a Host header is client-supplied, and building a
  # password-reset link out of one is how the link ends up pointing at
  # somebody else's domain.
  #
  # Real rather than a placeholder, unlike the two lines above: a public URL is
  # not personal data, and the alternative is a value nobody can verify until a
  # reset link has already gone out wrong. `send.` is the mail subdomain and is
  # not this.
  MTGLAB_BASE_URL = "https://sylvan-libraries.com"

  # The sending address, which must be on the domain verified with Resend.
  # `RESEND_API_KEY` is a secret and is not here; `sender_from_env()` refuses
  # to start without it when auth is on, deliberately — the console fallback
  # would print recipient addresses into Fly's logs, which ADR 16 forbids.
  #
  # No mailbox is behind this. Nothing reads replies, which is what `no-reply`
  # is for.
  MTGLAB_EMAIL_FROM = "sylvan-library <no-reply@send.sylvan-libraries.com>"

  # The header naming the real client, for login rate limiting.
  #
  # **Not optional here, and its absence is worse than it looks.** Unset,
  # `auth.client_address` falls back to the socket address — which behind Fly's
  # proxy is the proxy, so every login attempt from everybody shares one bucket
  # and one person mistyping their password 429s the whole instance. The
  # default is off because a header any client can set is a rate limit any
  # client can opt out of.
  #
  # **What Fly documents, stated exactly.** `Fly-Client-IP` is "the IP address
  # of the client from the perspective of Fly Proxy" — the proxy sets it from
  # what it sees, which is the property this needs. What their page does *not*
  # say in as many words is that it overwrites a value a client sent, so treat
  # that as strongly implied rather than guaranteed, and worth one check after
  # the first deploy: send a request with a `Fly-Client-IP` of your own and see
  # whether the auth log records it or the real address.
  #
  # Trading up rather than down either way. Unset, *everyone* shares the
  # proxy's bucket and one mistyped password locks out the instance; the worst
  # case here is that a caller who knows to send the header gets its own, which
  # is where it started.
  #
  # Two things that would break it, both on §7's list already: putting
  # Cloudflare Access in front makes this Cloudflare's addresses rather than
  # the visitor's — Fly documents that outright — and so would any other
  # reverse proxy. Moving off Fly means removing this line, not renaming it.
  MTGLAB_CLIENT_IP_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "mtglab_data"
  destination = "/data"
  # 3GB, sized in §4 step 3 to hold the ~63MB pool, the ~98MB of Scryfall
  # downloads it is built from, `app.db`, the decks, and a backup. Both halves
  # of that download now actually land here — until 2026-08-12 `download_bulk`
  # wrote to a relative `data/scryfall`, which in this container would have
  # been the ephemeral layer rather than the volume this line sizes.
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true

  # ---- Held awake through primary development ----------------------------
  #
  # Added 2026-08-13 as "a few days of testing"; **that deadline was wrong and
  # is deliberately removed.** Reviewed 2026-08-14 and the call is to hold this
  # until primary development is done, not until a date — suspend/resume was
  # interfering with testing badly enough that the money is not the deciding
  # term. Restore the block below this one *then*, and not on a calendar.
  #
  # What it costs while it stands: a `shared-cpu-1x`/1GB machine held up around
  # the clock is roughly $0.19/day, against near-zero when it scales to zero
  # between visits. Cheap enough to be the wrong thing to optimise mid-build,
  # and worth actually reverting once the building stops.
  #
  # Why the file and not `fly machine update --autostop=off`: **a deploy
  # applies `fly.toml`**, so anything set with a CLI command is silently undone
  # by the next one. That is not hypothetical — it is exactly how the machine
  # got scaled from `performance-1x` back to `shared-cpu-1x` earlier today. A
  # setting that has to survive deploys has to be tracked in git.
  #
  # What it buys, and it is not comfort: suspend/resume kept interrupting
  # measurement. Every `fly ssh console` in this session had to be preceded by
  # an HTTP request to wake the machine, and a four-minute request is exactly
  # the kind of work a suspend lands in the middle of. Holding it awake removes
  # that variable from anything measured against the instance.
  #
  # `min_machines_running` is belt and braces: with `auto_stop_machines` off it
  # is not consulted, but leaving it at 0 reads like permission to scale to
  # zero and this block exists to say the opposite.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # ---- The steady state to restore afterwards ----------------------------
  #
  # Scale to zero between visits. §3's conclusion was that idle dominates the
  # bill for a handful of friends, and this is the setting that acts on it —
  # worth more than every micro-optimisation in that section combined.
  #
  # `suspend` rather than `stop`: it resumes from memory, so a wake is fast.
  # This is also why seeding the pool is not a boot step — several minutes of
  # download on the wake path would turn a visit into an outage.
  #
  # auto_stop_machines = "suspend"
  # auto_start_machines = true
  # min_machines_running = 0

  [http_service.concurrency]
    # One process, so these are request-level guards rather than a worker
    # count. See the Dockerfile's CMD for why a second worker is not safe:
    # `api/jobs.py` keeps its registry in a module-level dict, so a sim
    # submitted to one process is a 404 from the other.
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  # The same endpoint as the image's HEALTHCHECK, checked from outside the
  # container. `/api/health` is on `PUBLIC_PATHS`, so it answers 200 with auth
  # on — that is what makes it usable here rather than a login redirect. It
  # reports pool state in its body, but an unseeded instance is a correct
  # state between deploy and §4 step 6, not an unhealthy one.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb is too tight: DuckDB, numpy, an Argon2id hash at its configured cost,
  # and a Tier 1 sweep all want headroom at once. §7 flags this as the number to
  # watch if Forge is ever added, which is most of why that would mean Hetzner.
  memory = "1gb"
