# Template deck file. Copy to decks/<slug>/deck.yaml and fill in.
# This file is the SOURCE OF TRUTH. All five artifacts are generated from it.
# Run `mtglab validate <slug>` before generating anything.

slug: my-deck
name: My Deck Name
# built = the cards are sleeved up; theoretical = a list you are
# thinking about. Absent means theoretical, so nothing is ever
# silently claimed as owned.
status: theoretical
# draft = imported, not yet reasoned about; curated = every card
# justifies its slot. Absent means curated -- the opposite default
# from status, so an existing deck is never silently demoted. In a
# draft a missing `why` is a counted warning; promotion to curated
# is refused while any card is blank, and artifacts stay blocked.
# `mtglab decks import` writes drafts. See docs/adr/0013.
stage: curated
commander:
  - Gyome, Master Chef
# companion: Kaheera, the Orphanguard   # sits outside the 100
bracket: 4

strategy: >
  One paragraph. What the deck is trying to do and how it wins.

# Prose that only a conversation can produce. It lives here so it survives
# regeneration -- the primers read these keys directly.
notes:
  commander_why: Why this commander and not the alternatives.
  gameplan: The 30-second version for someone picking the deck up cold.
  mulligan: >
    Derive this from a Tier 1 sweep, do not guess.
    e.g. "keep 2-5 lands AND lands + cheap ramp >= 3"
  curve_plan: Turn-by-turn shape.
  pitfalls: Three things that will kill you.
  engine_detail: How the engine actually assembles.
  lines: Key sequencing decisions.
  wincons: Every way this deck closes.
  manabase: Why this land count, why these duals.
  matchups: Versus the archetypes you actually face.
  politics: What to say at the table.
  failure_modes: What going wrong looks like and how to recover.
  swap_philosophy: When to bring in the swap board.
  rules_corners: Interactions worth knowing cold.

# Every card needs a category and a `why`. Validation FAILS without them --
# that is deliberate. A card you cannot justify is a card to cut.
cards:
  - name: Command Tower
    category: land
    why: Perfect fixing in the command zone's colors, no downside.
  - name: Sol Ring
    category: ramp
    why: The single most efficient accelerant in the format.

# Cards kept just outside the 99, with the reason they are on the bubble.
swap_board:
  - name: Bojuka Bog
    category: land
    why: Graveyard hate on a land; bring in against reanimator pods.

# The machines this deck can assemble. Optional, terse, and entirely the
# author's: nothing generates this block and nothing prunes it.
#
# There is no `name` -- an entry is called after the cards it is made of, so
# the heading cannot go stale when a piece changes. `cards` are exact pool
# names (the deck page hovers each one), `produces` is what the machine makes,
# `how` is the instructions in the order your hands do them, and `setup` is
# what it costs to get there.
#
# An entry that names `needs` is one card short of assembling, and it always
# says what would come out for it in `cut` -- a card to bring in is only a
# suggestion once there is a slot for it. The gate warns about a catalogue
# that has drifted from the deck beside it (a piece that was cut, a `needs`
# that has since arrived); it never refuses one.
#
# `by: claude` appears only on an entry Claude drafted, and comes off the
# moment a person edits what it says -- the same mark, and the same rule, as
# `why_by` on a card.
combos:
  - cards: [Axebane Guardian, High Alert]
    produces: infinite colored mana; infinite untaps of your creatures
    how: 1) Tap Axebane Guardian for X, where X is your defender count.
      2) Pay {2}{W}{U} to High Alert to untap it. 3) Each crank costs four
      and makes X.
    setup: six mana across two quiet turns, then the fifth defender; the
      Guardian must be free of summoning sickness.
  - cards: [Axebane Guardian]
    needs: Umbral Mantle
    produces: infinite colored mana
    how: 1) Equip the Mantle. 2) Pay {3} to untap the Guardian. 3) Repeat
      while you have five or more defenders.
    setup: four mana, the Mantle, and a board of walls.
    cut: Suspicious Bookcase
