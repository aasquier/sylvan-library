<!-- The parchment's deckle edge, second cut: the mask that turns the
     scroll's silhouette from a border-radius into torn skin. Generated,
     not drawn: numpy default_rng(1909), two noise scales per edge (a slow
     wander of +/-7, a fine tooth of +/-2.6 in a 1000x700 box), corners
     SHARED between edges and the tooth damped to zero approaching them
     (the first cut generated edges independently and the disagreement
     left stray slivers on the corners). Held 10 units inside the box
     because a mask ramp that reaches the box edge gets squared off by
     the compositor. Em dashes only in this comment: a double hyphen is
     illegal XML and WebKit answers an invalid mask by masking
     everything. Regenerate from the parameters above rather than editing
     points by hand. -->
