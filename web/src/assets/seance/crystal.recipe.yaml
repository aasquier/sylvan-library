# The reader's crystal ball, and the room behind it (ROADMAP item 13, PR 2).
#
# The old ball was inline SVG -- good optics, entirely geometry, and it
# still read as a drawing of a sphere rather than a sphere. Commandment 5
# asks for the real thing where a real thing is free, so the shell is now a
# photograph: a smoky-quartz sphere on a glass stand, CC0, matted to its own
# silhouette and composited over our own smoke and candlelight with the
# turned card surfacing inside the glass.
#
# The composite is four layers and each is its own file, because that is
# what lets the card sit *inside* the ball: candle glow and smoke behind,
# the vision in the middle, and the photographed glass on top, carrying its
# own veils, its specular arc and its rim highlight over the card. A single
# flattened image could not do that -- the vision has to be between the
# background and the glass.
#
# The crop box is measured rather than eyeballed: the sphere's silhouette
# was found by blue-dominance against the felt (the background is strongly
# blue and the quartz is not), giving a centre of (517.5, 291) and a radius
# of 244 in the 1024x683 original. `frac_box` records it in fractions so it
# survives a re-fetch at another size, and `mask_circle` then keys on that
# same geometry -- a chroma matte cannot cut out a glass sphere, since the
# whole subject is the background seen through it.
animist: 1

why_committed: >
  The photograph is CC0, so committing the derived asset is clean, and it
  is the ivy's argument again: a decoration that breaks when a third-party
  CDN moves is a decoration the app does not own. The two loops are
  generated by this pipeline, so committing them is the only way they exist
  at all -- no stock smoke, nothing hotlinked, just weather of our own
  making.

sources:
  # The Met's own crystal ball on a bronze stand in the shape of a fish
  # (Aaron chose it, 2026-08-17, from a board of six). Museum open access,
  # so the plate is CC0, and it solves the problem the drawn cradle never
  # could: the sphere and its stand come from ONE photograph, with one
  # light, one shadow and one set of material responses. Our own quartz
  # replaces the Met's sphere in the claws -- the composite the app builds
  # is the fish photograph over the glass, so the bronze foam closes in
  # FRONT of the ball and it reads as held rather than balanced.
  fish:
    provider: openverse
    identifier: 36e20fe8-8084-44f9-8036-fe1da5b3256c
    title: "Crystal Ball on a Bronze Stand in the Shape of a Fish"
    landing: https://www.rawpixel.com/image/8194602/crystal-ball-bronze-stand-the-shape-fish
    found_via: "Openverse with a license=cc0 filter, searching `crystal ball stand`"
    licence: CC0-1.0

  orb:
    provider: openverse
    identifier: 6c8678e6-c6d5-4f94-bfe9-8eeef47814ba
    title: "Crystal ball"
    landing: https://www.flickr.com/photos/76523360@N03/27935639395
    found_via: "Openverse with a license=cc0 filter, searching `crystal ball`"
    licence: CC0-1.0

  # Séance smoke: slower and larger-featured than the Laboratory's mist,
  # because this is one room's air rather than weather over a landscape,
  # and it drifts across the ball rather than past it. Seed 1848 -- the
  # year the Fox sisters started the spiritualist craze the fortune-
  # teller's table is dressed from.
  smoke:
    provider: procedural
    seed: 1848
    licence: ours-generated

  # The candle that lights the smoke from behind. Same construction as the
  # Laboratory's embers and deliberately not the same numbers: a single
  # flame's light is one broad pool that breathes, so the scale is lower
  # still and the advection almost nothing. Seed 1909, for the printing.
  candle:
    provider: procedural
    seed: 1909
    licence: ours-generated

outputs:
  # THE GEOMETRY THE APP NEEDS, measured off this output and recorded here
  # because nothing in the file can carry it: in the 700x950 asset the
  # bronze foam closes at y=290 (0.3053 of the height) and its centre is
  # x=529 (0.7557 of the width). The ball is drawn at r=265 (0.3786 of the
  # width) with its centre 0.88 radii ABOVE the claw line -- 0.88 is
  # Aaron's, off a board of four: at 0.62 the claws crossed the ball's
  # belly and it read as impaled, and past 0.96 it floats. The ball
  # deliberately overhangs this asset's box, which is free because the orb
  # is an absolutely positioned layer.
  - file: crystal-fish.webp
    from: fish
    ops:
      # The object, dropping the museum label band along the bottom.
      - crop: {frac_box: [0.0393, 0.0244, 0.9567, 0.9521]}
      # `soft` is doing the real work: what survives a hard threshold here
      # is not backdrop but the object's own cast shadow (143-167 against a
      # ground of 192), and no single cut spares the bronze while taking
      # the shadow. The ramp fades it out instead. `enclosed: drop` kills
      # the studio grey framed inside the arch of the wave, which would
      # otherwise read as a hole cut in the felt.
      - matte_backdrop: {tolerance: 34, soft: 40, border: 2, enclosed: drop}
      - duotone: {shadow: "#261a0e", mid: "#8c6e44", light: "#faf0d0"}
      - resize: {width: 700}
    encode: {format: webp, quality: 88}
    expect: {width: 700, height: 950, budget_kb: 260, metadata: none}

  # The same quartz as `crystal-shell.webp`, graded through the fish's own
  # ramp. Two photographs on one table have to share a plate or the glass
  # reads as pasted onto the bronze -- which it visibly did before this
  # existed. Kept as a second file rather than a changed one so the violet
  # ball still works while the fish is being wired up.
  - file: crystal-shell-sepia.webp
    from: orb
    ops:
      - crop: {frac_box: [0.2588, 0.0571, 0.7510, 0.7950]}
      - mask_circle: {cx: 0.5, cy: 0.5, r: 0.482, feather: 2.0}
      - duotone: {shadow: "#241a12", mid: "#8e7a5e", light: "#f6ecd6"}
      - resize: {width: 640}
    encode: {format: webp, quality: 86}
    expect: {width: 640, height: 640, budget_kb: 120, metadata: none}

  - file: crystal-shell.webp
    from: orb
    ops:
      # Square around the sphere, with ~8px of margin outside the radius so
      # the feather has somewhere to land.
      - crop: {frac_box: [0.2588, 0.0571, 0.7510, 0.7950]}
      # r is 244/504 of the cropped width, pulled in a hair so the felt's
      # blue does not survive as a fringe; the feather straddles the edge.
      - mask_circle: {cx: 0.5, cy: 0.5, r: 0.482, feather: 2.0}
      - resize: {width: 640}
    encode: {format: webp, quality: 86}
    expect: {width: 640, height: 640, budget_kb: 120, metadata: none}

  - file: seance-smoke-loop.webm
    from: smoke
    ops:
      - spectral_noise: {width: 420, height: 420, frames: 120, fps: 20,
                         scale: 1.6, time_scale: 0.7, falloff: 2.9}
      - advect: {strength: 7.0, scale: 1.6}
      - color_ramp: {low: "#070518", high: "#b9a4e6"}
      - resize: {width: 720}
    encode: {format: webm, crf: 40}
    expect: {width: 720, height: 720, frames: 120, fps: 20, budget_kb: 700,
             metadata: none}

  - file: seance-smoke-loop.mp4
    from: smoke
    ops:
      - spectral_noise: {width: 420, height: 420, frames: 120, fps: 20,
                         scale: 1.6, time_scale: 0.7, falloff: 2.9}
      - advect: {strength: 7.0, scale: 1.6}
      - color_ramp: {low: "#070518", high: "#b9a4e6"}
      - resize: {width: 720}
    encode: {format: mp4, crf: 30}
    expect: {width: 720, height: 720, frames: 120, budget_kb: 700,
             metadata: none}

  - file: candle-glow-loop.webm
    from: candle
    ops:
      - spectral_noise: {width: 360, height: 360, frames: 120, fps: 20,
                         scale: 1.1, time_scale: 1.9, falloff: 3.1}
      - advect: {strength: 2.0, scale: 1.1}
      - color_ramp: {low: "#0b0602", high: "#ffcf87"}
      - resize: {width: 560}
    encode: {format: webm, crf: 42}
    expect: {width: 560, height: 560, frames: 120, fps: 20, budget_kb: 520,
             metadata: none}

  - file: candle-glow-loop.mp4
    from: candle
    ops:
      - spectral_noise: {width: 360, height: 360, frames: 120, fps: 20,
                         scale: 1.1, time_scale: 1.9, falloff: 3.1}
      - advect: {strength: 2.0, scale: 1.1}
      - color_ramp: {low: "#0b0602", high: "#ffcf87"}
      - resize: {width: 560}
    encode: {format: mp4, crf: 32}
    expect: {width: 560, height: 560, frames: 120, budget_kb: 520,
             metadata: none}
