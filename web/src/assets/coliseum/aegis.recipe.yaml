# The shield that comes up when something blocks.
#
# Forge's event stream says `block` and names both cards -- the blocker and the
# attacker it stepped in front of -- and a block is the most decisive thing
# that happens in a Magic combat, so it gets an object rather than a colour.
#
# **This is the third shield to stand here, and it overturns the second one's
# central argument, which had already overturned the first's.** Both of those
# recipes were about a *round* shield. The first shipped a flat grey disc and
# reasoned that a silhouette is all that survives at thirty pixels. Aaron read
# it as "more like an emblem or symbol than an actual shield". The second
# accepted that, kept the circle, and fixed the *lighting*: draw it larger,
# take a plate that is domed and raked rather than lit flat, let gold against a
# dark rim give it a material. Everything in that paragraph is true, the mark
# genuinely got better, and Aaron's reading of it was: "it looks more like a
# coin than a shield."
#
# **Two rounds died on the same unexamined premise, so the premise is the
# thing to name: a circle cannot be rescued by lighting.** A disc read at a
# glance is a coin, a seal, a boss, a logo -- every round object a person meets
# in a day is one of those, and none of them is a shield. No amount of volume
# changes what a circle *is*; the volume only makes it a well-lit coin. The
# meaning has to live in the outline, because at fifty-eight pixels the outline
# is what a player is actually reading.
#
# So the outline changes. **A heater shield** -- flat across the top, sides
# falling straight and then curving in, tapering to a point at the foot -- is
# the shape that says *knight* with no caption anywhere in the world. It is the
# shape on every coat of arms, every pub sign, every road sign for a castle. It
# is also the shape Magic's own frames and symbols reach for. Nothing else is
# that shape, which is exactly what the disc could not claim.
#
# **The object is the shield of Konrad, Landgrave of Thuringia** (d. 1240),
# from the Elisabethkirche in Marburg: one of the very few knight's shields of
# its century that still exist, and the arms are a rampant lion modelled in
# gesso relief. That relief is the second half of the choice. A painted flat
# would be mud at this size; a *relief* is lit, so the lion reads as light and
# shadow rather than as a picture, and light and shadow are the only interior
# detail that survives being small. Konrad ended his life as Grand Master of
# the Teutonic Order, so the object is a knight's shield in the strictest
# sense -- and a lion on a shield is the most Magic image an armoury can
# produce without leaving the thirteenth century.
#
# **The photograph is Ludwig Bickell's, and its retouching is the reason this
# one is cuttable at all.** Bickell (d. 1901) opaqued the negative around the
# shield -- painted the ground out by hand, which is what a nineteenth-century
# plate maker did instead of a studio sweep -- so the object sits in a field
# that is near-white, near-uniform, and reaches every edge of the frame once
# the crop is placed inside it. That is precisely the condition `matte_backdrop`
# was written for: it floods inward from the frame edge and stops where the
# colour stops, so the cut is made by *connectivity* rather than by a threshold,
# and a heater's straight sides and sharp point come out exact. `mask_circle`
# cannot state a heater the way it could state a disc -- the previous recipe's
# one real advantage, gone with the circle -- and this plate is the answer to
# losing it.
#
# **Black and white, deliberately kept.** The plate is a glass negative and
# there is no colour in it to recover; the stylesheet warms it instead, which
# is a different job from the chroma correction the gold disc wanted and is
# argued where it lives. A grey shield with a lion cut into its light is an
# older, colder object than a gilt parade disc, and the room it stands in is a
# sand floor under a low sun.
animist: 1

why_committed: >
  It is drawn at the moment a beat lands and lives for about a second, which
  makes it the worst possible thing to fetch from somebody else's CDN: a mark
  that arrives after the sentence it belongs to has been read is not a mark, it
  is a flicker on an unrelated card. It is also small enough that committing it
  costs less than the request would. And the licence here is a *photograph of a
  medieval object*, which is the category where somebody else's file quietly
  changes licence or vanishes -- a copy checked once and committed is a copy
  whose provenance stays true.

sources:
  # Public domain outright, confirmed through the Commons API: Ludwig Bickell
  # died in 1901 and the shield is thirteenth-century. Nothing is owed, which
  # is the only kind of licence a decoration may carry.
  aegis:
    provider: wikimedia
    title: "Schild des Landgrafen Konrad von Thüringen fm810232.jpg"
    landing: https://commons.wikimedia.org/wiki/File:Schild_des_Landgrafen_Konrad_von_Th%C3%BCringen_fm810232.jpg
    found_via: >
      Commons, through the category `Photographs of shields by Ludwig Bickell`,
      which is where the search finally landed after the Met's Arms and Armor
      department turned out to hold no heater at all -- its shields are discs,
      dhals and bouched targes, and a bouche's lobed outline is no more legible
      small than a circle is. The category was reached from `Heater shields`;
      every file in it was licence-checked and every one of them passes
    licence: Public domain

outputs:
  # 300 x 372, which is the shield's own proportion rather than a chosen one:
  # a heater is taller than it is wide and the mark has to be, or the shape
  # that carries the whole meaning is the shape being squashed. Larger than the
  # disc it replaces (260 square) because the stylesheet now sizes the mark by
  # its *height* against the card, so the wide axis has less work to do and the
  # tall one has more.
  - file: aegis.webp
    from: aegis
    ops:
      # Inside the opaquing, not around it. The retouched field is what the
      # matte floods through, so the crop's own frame edge has to land in it
      # everywhere -- one corner left outside and the flood starts in the
      # unpainted plate, walks nowhere, and the whole ground survives.
      - crop: {frac_box: [0.1162, 0.1916, 0.9072, 0.9172]}
      # Flood the opaquing away. `border` is generous because the retouching is
      # brush-laid and its outermost millimetre is thinner than the rest;
      # `soft` carries the last of it, and the same ramp is what lets the
      # shield's own contact shadow fade instead of standing as a grey wedge.
      - matte_backdrop: {tolerance: 30, border: 6, soft: 26, enclosed: drop}
      - resize: {width: 300}
    encode: {format: webp, quality: 84}
    expect: {width: 300, height: 364, budget_kb: 60, metadata: none}
