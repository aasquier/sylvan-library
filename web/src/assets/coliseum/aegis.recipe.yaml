# The shield that comes up when something blocks.
#
# Forge's event stream says `block` and names both cards -- the blocker and the
# attacker it stepped in front of -- and a block is the most decisive thing
# that happens in a Magic combat, so it gets an object rather than a colour.
#
# **This replaces the Turkish shield that stood here first, and it overturns
# that recipe's argument on purpose.** The old one reasoned that a mark has
# thirty pixels of room, that almost nothing photographic reads at that size,
# and that a disc survives because its meaning is carried entirely by its
# silhouette. It then rejected an embossed Italian parade shield in as many
# words: glorious at full size and mud at thirty pixels. Everything in that
# paragraph is true and the conclusion was still wrong, because it treated the
# render size as a fact about the world. Aaron's reading of what shipped was
# that it "looks more like an emblem or symbol than an actual shield", and
# that is exactly what a flat grey disc with a small central boss is -- a
# silhouette with nothing inside it reads as a seal, a coin, a logo. The fix
# has two halves and the recipe only owns one: **draw it bigger, and give it
# something that survives being looked at.**
#
# **What carries an object at this size is its lighting, not its ornament.**
# The battle scene on this shield really is mud below a hundred pixels or so,
# and it does not matter. What reads is that the disc is *domed* -- lit from
# the upper left, bright along the top rim, falling into shadow at the bottom
# -- and that its edge is a dark band of steel rather than a cut line. Gold
# against that dark rim gives it a material at any size. The old shield was
# lit flat, so it had a silhouette and no volume, which is the definition of
# an emblem.
#
# **The shield is an ellipse in the photograph, and it is a circle in life.**
# Measured off the plate, its horizontal radius is 598 pixels and its vertical
# one 518: the camera was tilted about thirty degrees. Cropping to that
# ellipse and resizing to a square undoes the foreshortening, which is why the
# resize carries both a width and a height. It is not a distortion, it is the
# removal of one -- and it is also what lets `mask_circle` do the cut, since a
# circular mask over an elliptical shield leaves a crescent of studio ground
# at the top. That crescent is what the first attempt shipped into a proof
# sheet, and it is how the tilt was found at all.
animist: 1

why_committed: >
  It is drawn at the moment a beat lands and lives for about a second, which
  makes it the worst possible thing to fetch from somebody else's CDN: a mark
  that arrives after the sentence it belongs to has been read is not a mark, it
  is a flicker on an unrelated card. It is also small enough that committing it
  costs less than the request would.

sources:
  # `isPublicDomain` is true on object 24688, confirmed through the Met's API.
  # The plate is why this one is usable where other parade shields are not:
  # the disc is face-on and complete, and its outer rim is the darkest thing
  # in frame, which is what made the silhouette measurable.
  aegis:
    provider: met
    identifier: "24688"
    title: "Round Shield with the Surrender of the Elector of Saxony at Mühlberg, Milan, ca. 1560-70"
    landing: https://www.metmuseum.org/art/collection/search/24688
    found_via: >
      the Met Open Access API, searching the Arms and Armor department for
      round shields with a full studio plate, then keeping the ones lit with a
      raking light rather than flat -- volume is the whole requirement, and it
      is a fact about the photograph rather than about the object
    licence: CC0-1.0

outputs:
  # 260 square for a mark that renders at roughly 60-76. Larger than the disc
  # it replaces (220) because the mark itself is drawn larger now, and a
  # shield that is legible as an object is the entire point of the change.
  #
  # **No key at all, which is the other half of the improvement.** The old
  # shield needed `matte_backdrop` because steel and its ground are both grey
  # and only connectivity told them apart. This plate cannot be keyed by any
  # method: its studio sweep runs from 74 at the top right to 222 at the
  # bottom right, so no single tolerance spans the ground without swallowing
  # the shield, and the lower ground is a cool blue-grey rather than neutral,
  # which defeats a chroma key too. None of that matters, because the subject
  # is a circle and a circle can be *stated*. The edge is computed from a
  # distance field, so it is exact and has no fringe to inspect -- the one
  # cut in this directory that cannot leave a halo.
  - file: aegis.webp
    from: aegis
    ops:
      # The ellipse's bounding box, measured off the rim rather than by eye:
      # centre (742.5, 865), semi-axes 598.5 and 518.
      - crop: {frac_box: [0.0941, 0.1843, 0.9039, 0.7453]}
      # Both axes named, so the ellipse becomes the circle the object is.
      - resize: {width: 260, height: 260}
      # A hair inside the rim (0.497 rather than 0.5): the cost is a fraction
      # of a pixel of steel and the gain is certainty that no studio grey
      # survives anywhere on the circumference.
      - mask_circle: {cx: 0.5, cy: 0.5, r: 0.497, feather: 1.5}
    encode: {format: webp, quality: 82}
    expect: {width: 260, height: 260, budget_kb: 40, metadata: none}
