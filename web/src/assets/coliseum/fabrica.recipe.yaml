# The forge an artifact is struck out on.
#
# Aaron, 2026-08-28, opening the entry animations out from the one scene they
# had: *"hopefully find a good image of a hammer hitting an anvil with sparks
# for artifacts entering"*. This is the fourth place in the arena and the
# second half of the rule that came out of that conversation — a card that
# becomes an **object** on the table opens onto a picture of a real place, and
# a card that is only ever an **event** is drawn from the tarot's arcana. An
# artifact is the most object-like thing in Magic; it gets the most physical
# place in the room.
#
# **A painting, for `campus.recipe.yaml`'s reason and not for its own.** The
# road and the vault are photographs because the Via Appia and the Vigna Codini
# columbaria are still there to stand in. A working charcoal forge under a
# ruined brick vault, lit only by the iron in it, is not — the thing exists as
# heritage demonstration and as an industrial museum, both of which photograph
# as heritage demonstration. What survives of the real one is the picture
# somebody painted while it was still ordinary.
#
# **Joseph Wright of Derby, `An Iron Forge`, 1772, Tate.** A water-driven helve
# hammer over an anvil, a bar of iron at white heat on it, and every other
# thing in the painting — the brick vault, the timbers, the six people watching
# — lit by nothing but that bar. Wright is the painter of exactly this: light
# with a source in the picture rather than off the top-left corner, which is
# also the one composition that survives being six hundred pixels wide behind a
# card. A bright core in darkness is still a bright core in darkness at any
# size; a scene lit evenly is a grey field.
#
# **It is not Roman, and `campus.recipe.yaml` has already had that argument.**
# The short of it: the register break happens the moment the subject is chosen,
# because there is no Roman picture of this. Roman smithing survives as Vulcan
# — Velázquez's `Fragua de Vulcano` is the famous one and it was fetched and
# rejected — and every Vulcan is a frieze of figures across the front of the
# frame with a god in it. A frieze is the shape this room has now rejected four
# times (`via`, `crypta`, `campus`, this), and a god standing behind a Magic
# card is a second subject competing with the first.
#
# ## What the proof sheet said, against what was expected
#
# **`A Blacksmith's Shop` was chosen first and the crops overturned it**, which
# is the whole reason a band is rendered with a card standing in it before
# anything is fetched at full size. Wright painted both, a year apart, and the
# Blacksmith's Shop is the better answer to Aaron's sentence: men with hammers
# actually raised, sparks visibly coming off the anvil. It is also portrait,
# and its glowing bar sits at **centre-bottom** — dead under where the stage
# draws a card. Cropped to a band and stood behind a card, the card lands
# square on the two smiths and buries the entire light source, and what is left
# either side is dark legs and a crowd of onlookers' faces competing with the
# card for the eye.
#
# `An Iron Forge` puts its hot bar at **centre-left**. The card stands in the
# light instead of on top of it, the helve hammer's timber drives in from the
# left edge, and the brick vault recedes to the right — so this is a place with
# depth in it rather than a wall of people, which is the property the other
# three scenes were each chosen for.
#
# **The sparks come back as motion, not as pigment.** They are what Aaron
# asked for and this painting has none — so they are drawn, bursting from under
# the card on the beat it lands, the way `.stage-field-dust` blooms under a
# creature arriving on the valley. That element is already the one thing in
# these scenes that is not a fact about the picture, and for the same reason:
# the picture is a place that was already there, and something has just been
# put down in it.
#
# **No key, no duotone, no levels — crop and resize and nothing else**, which
# is the restraint every picture in this directory keeps. This one is a
# tenebrist oil and the temptation to lift its shadows is real; the stylesheet
# lays its own dusk over this, and a level baked into the byte stream is a
# decision `index.css` can no longer argue with.
animist: 1

why_committed: >
  The three scenes beside it, exactly. This draws on the beat an artifact
  arrives and is gone about a second later, so fetching it from somebody
  else's host would mean a forge that opens after the card standing in it has
  faded. And the licence is the second reason: this is a PD-Art photographic
  reproduction on Commons, which is the category where somebody else's copy
  quietly moves or changes terms -- a copy confirmed once and committed is a
  copy whose provenance stays true.

sources:
  # `LicenseShortName` is "Public domain" on Commons, confirmed through the
  # API, with `AttributionRequired` explicitly false. Two independent grounds:
  # Wright died in 1797, so the work is out of copyright everywhere the term is
  # life plus 100 or fewer, and the photograph of it is a faithful reproduction
  # of a two-dimensional public domain work. A term expiry rather than a
  # dedication, which is the reason to re-confirm it on every build rather than
  # trust this comment.
  fabrica:
    provider: wikimedia
    title: "Joseph Wright - An Iron Forge - Google Art Project.jpg"
    landing: https://commons.wikimedia.org/wiki/File:Joseph_Wright_-_An_Iron_Forge_-_Google_Art_Project.jpg
    found_via: >
      Commons, searching the painter and the painting by name -- which is the
      search that works here and the one `campus.recipe.yaml` recorded. Every
      unrestricted phrasing (`blacksmith anvil sparks`, `forge hammer glowing
      iron`, `smithy interior night`) returns modern photographs under CC BY-SA
      and scanned trade catalogues. Three candidates were fetched and cropped
      with a card stood in them before this one was chosen: Wright's own
      `A Blacksmith's Shop` (Yale, 4688x5975, rejected on the crop -- see the
      header), Velazquez's `La Fragua de Vulcano` (Prado, 2952x2293, a frieze
      with a god in it), and this. The Google Art Project scan is 2801x2572,
      which is nearly square and the reason a wide band comes out of it without
      throwing most of the painting away.
    licence: Public domain

outputs:
  # 660 wide, between the road's 560 and the valley's 720, and the number is
  # about what is in the picture rather than about a budget.
  #
  # **It needs more than the road and less than the valley.** The road could be
  # under-sampled because it is foliage; the valley needed 720 because its whole
  # reading is *those are men and horses*, at the size of ants. Here the subject
  # is one bright bar and a brick vault, and the figures are large and few — so
  # the enlargement this can stand sits between the two.
  #
  # Quality 76, one below the valley's 78 and two above the road's 74. A
  # tenebrist oil is mostly shadow with a small blazing core, which is the
  # cheapest thing a codec ever meets: there is nothing in the dark two thirds
  # for it to spend bytes on, and the core is a smooth gradient.
  - file: fabrica.webp
    from: fabrica
    ops:
      # The roof timbers off the top and the flagstones off the bottom: both
      # are dark and neither has anything in it. What is left runs from the
      # helve hammer's beam and the hot bar across the left, through the anvil
      # and the smith, into the brick vault and the watchers on the right.
      # Fitted by cropping the Commons thumbnail at four heights, rendering
      # each with a card stood in it at the size the stage draws one, and
      # looking at all four.
      - crop: {frac_box: [0.02, 0.30, 1.0, 0.92]}
      - resize: {width: 660}
    encode: {format: webp, quality: 76}
    expect: {width: 660, height: 383, budget_kb: 60, metadata: none}
