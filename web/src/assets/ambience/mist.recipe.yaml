# The forest mist (ADR 31) -- the first asset this pipeline generated from
# nothing: no photograph, no upstream, no licence to confirm. The source IS
# the declaration below (its seed), and a rebuild from this file alone
# reproduces the loop up to encoder drift.
#
# Generated at 480x270 and upscaled 2x deliberately: mist is soft by nature,
# Lanczos upscaling costs it nothing visible, and the full-resolution FFT
# volume would cost ~600MB of RAM against this machine's means. The loop is
# periodic in x, y and t by construction (frequency-domain synthesis over
# integer cycle counts), so it tiles horizontally and closes at second six
# with no crossfade and no seam.
#
# crf values sit at `animist measure`'s knee for each codec; the
# dual encode is the browser-floor decision (webm for most, mp4 for the
# rest, one download per visitor either way). The poster is frame zero of
# the same derivation, what a reduced-motion visitor sees instead.
animist: 1

why_committed: >
  Generated by this pipeline, so committing it is the only way it exists at
  all -- and a background the site drew for itself is the whole point of
  ADR 31: no clip art, no stock loop, nothing hotlinked, just weather of
  our own making.

sources:
  mist:
    provider: procedural
    seed: 6161
    licence: ours-generated

outputs:
  - file: mist-loop.webm
    from: mist
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 3.0, time_scale: 1.0, falloff: 2.7}
      - advect: {strength: 5.0, scale: 2.0}
      - color_ramp: {low: "#0b1611", high: "#89a894"}
      - resize: {width: 960}
    encode: {format: webm, crf: 40}
    expect: {width: 960, height: 540, frames: 120, fps: 20, budget_kb: 700,
             metadata: none}

  - file: mist-loop.mp4
    from: mist
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 3.0, time_scale: 1.0, falloff: 2.7}
      - advect: {strength: 5.0, scale: 2.0}
      - color_ramp: {low: "#0b1611", high: "#89a894"}
      - resize: {width: 960}
    encode: {format: mp4, crf: 30}
    expect: {width: 960, height: 540, frames: 120, budget_kb: 700,
             metadata: none}

  - file: mist-poster.webp
    from: mist
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 3.0, time_scale: 1.0, falloff: 2.7}
      - advect: {strength: 5.0, scale: 2.0}
      - color_ramp: {low: "#0b1611", high: "#89a894"}
      - resize: {width: 960}
    encode: {format: webp, quality: 78}
    expect: {width: 960, height: 540, budget_kb: 60, metadata: none}
