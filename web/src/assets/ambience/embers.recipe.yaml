# Candlelight for the Laboratory (ADR 31): broad, slow pools of warm light
# that swell and settle the way a bench of candles breathes -- larger
# features than the mist (lower scale), a quicker pulse (higher
# time_scale), and only a whisper of advection, because flame-light moves
# by brightening rather than by drifting sideways. The seed is 1666,
# Newton's annus mirabilis -- an alchemist's year for an alchemist's room.
# Loop-perfect and tileable by the same FFT construction as its siblings.
animist: 1

why_committed: >
  Generated by this pipeline, so committing it is the only way it exists
  at all -- no clip art, no stock loop, nothing hotlinked, just weather of
  our own making (ADR 31's argument, verbatim, because it is the same
  argument).

sources:
  embers:
    provider: procedural
    seed: 1666
    licence: ours-generated

outputs:
  - file: embers-loop.webm
    from: embers
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 2.0, time_scale: 1.6, falloff: 2.6}
      - advect: {strength: 5.0, scale: 2.0}
      - color_ramp: {low: "#140b04", high: "#e8a755"}
      - resize: {width: 960}
    encode: {format: webm, crf: 40}
    expect: {width: 960, height: 540, frames: 120, fps: 20, budget_kb: 700,
             metadata: none}

  - file: embers-loop.mp4
    from: embers
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 2.0, time_scale: 1.6, falloff: 2.6}
      - advect: {strength: 5.0, scale: 2.0}
      - color_ramp: {low: "#140b04", high: "#e8a755"}
      - resize: {width: 960}
    encode: {format: mp4, crf: 30}
    expect: {width: 960, height: 540, frames: 120, budget_kb: 700,
             metadata: none}
