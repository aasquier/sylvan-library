# Mana wisps for the fortune-teller's table (ADR 31) -- the second asset
# generated from nothing. Where the mist is weather, this is *presence*:
# finer noise advected hard, so the field tears into drifting violet
# filaments -- the crystal ball's light given a room to move in. The seed
# is 1909, the year of the Rider-Waite printing whose cards the table
# deals; the loop is periodic in x, y and t by the same frequency-domain
# construction as the mist, so it tiles and closes without a seam.
#
# Same 480x270-then-2x economics as the mist: soft phenomena lose nothing
# to Lanczos upscaling, and the full-resolution FFT volume is RAM this
# machine does not have. crf values inherit the mist's measured knees --
# same generator, same statistics, same curve.
animist: 1

why_committed: >
  Generated by this pipeline, so committing it is the only way it exists
  at all -- no clip art, no stock loop, nothing hotlinked, just weather of
  our own making (ADR 31's argument, verbatim, because it is the same
  argument).

sources:
  wisps:
    provider: procedural
    seed: 1909
    licence: ours-generated

outputs:
  - file: wisps-loop.webm
    from: wisps
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 4.0, time_scale: 1.2, falloff: 2.3}
      - advect: {strength: 16.0, scale: 2.5}
      - color_ramp: {low: "#0b0716", high: "#9d86e8", gamma: 2.4}
      - resize: {width: 960}
    encode: {format: webm, crf: 40}
    expect: {width: 960, height: 540, frames: 120, fps: 20, budget_kb: 700,
             metadata: none}

  - file: wisps-loop.mp4
    from: wisps
    ops:
      - spectral_noise: {width: 480, height: 270, frames: 120, fps: 20,
                         scale: 4.0, time_scale: 1.2, falloff: 2.3}
      - advect: {strength: 16.0, scale: 2.5}
      - color_ramp: {low: "#0b0716", high: "#9d86e8", gamma: 2.4}
      - resize: {width: 960}
    encode: {format: mp4, crf: 30}
    expect: {width: 960, height: 540, frames: 120, budget_kb: 700,
             metadata: none}
