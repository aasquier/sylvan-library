[project]
name = "mtg-lab"
version = "0.2.0"
description = "Local Magic: the Gathering deckbuilding, simulation and shopping toolkit"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "duckdb>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
# python-dotenv lets `config.py` read a `.env` however the process was started,
# which is how the API key reaches the app locally. Optional and imported
# defensively: a base install has no `.env` to read, and the core stays light.
#
# argon2-cffi rides with `api` rather than getting an extra of its own. Auth
# exists to serve the app to more than one person, so an install with no web
# server has nothing to authenticate, and a base install still needs neither a
# network nor an account. `mtglab.auth.passwords` imports it at module level --
# a password hasher that might not be there is worse than one that is missing
# loudly -- and `cli.py` imports the auth package inside the `users` commands,
# so on a base install everything else works and only those report the extra.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-dotenv>=1.0",
       "argon2-cffi>=23.1"]
# The Claude surface (ADR 14/15). Its own extra rather than part of `api`
# because "off is a real position": a base install has a gate, a mana solver
# and a simulator that need no account and no network, and that should keep
# being installable. `mtglab.claude` imports the SDK inside functions, the same
# way `config.py` treats python-dotenv, so the package stays importable --
# and `claude.available()` answerable -- without it.
#
# 0.69 is the floor because `output_config` (which carries `effort`) is how
# depth is set on Sonnet 5; the older `budget_tokens` form is a 400 there.
claude = ["anthropic>=0.69"]
# httpx backs fastapi's TestClient, so the API tests need it. ruff's floor is
# 0.16 because the rule selection in [tool.ruff.lint] names rules added after
# 0.4, and an older ruff would error on the config rather than lint the code.
# hypothesis is not optional either: tests/test_mana_properties.py imports it
# at module level rather than behind an importorskip, deliberately, so that a
# missing install is an error instead of a silently shorter test run.
# `anthropic` is here so the boundary test in tests/test_claude_boundary.py
# runs on every checkout and in CI. That test is the one that must not be
# skippable: it is what keeps a model response out of a card's `why` as modes
# get added. It needs the package importable, not a key -- no test in the
# suite reaches the network or spends a token.
# mypy and the yaml stubs are here rather than optional: the type checker is a
# CI gate, so a checkout that cannot run it cannot reproduce the build. Without
# `types-PyYAML` the run reports two import-untyped errors and nothing else,
# which reads exactly like "the checker is broken".
# `argon2-cffi` is here for the same reason `anthropic` is: the tests that hold
# a boundary in place must not be skippable. tests/test_isolation.py is the one
# ADR 5 calls the highest-value test in the whole auth story, and without the
# hasher installed it would not run at all.
dev = [
    "pytest>=8.0", "ruff>=0.16", "httpx>=0.27", "coverage>=7.0",
    "hypothesis>=6.100", "python-dotenv>=1.0", "anthropic>=0.69",
    "mypy>=1.11", "types-PyYAML>=6.0", "argon2-cffi>=23.1",
]

[project.scripts]
mtglab = "mtglab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the built frontend inside the package so an install serves the UI
# without a Node toolchain present. `py.typed` marks the package as carrying
# inline annotations, so a consumer's own type checker reads them instead of
# treating every import from mtglab as `Any` (PEP 561).
mtglab = ["web_dist/**/*", "py.typed"]

[tool.coverage.run]
source = ["src/mtglab"]
# The __main__ fallback runners in tests/ are not part of the library.
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Not a gate -- a floor, so a large regression is loud while ordinary churn
# is not. Raise it deliberately, do not let it drift down.
#
# 80 -> 90 on 2026-08-12. The number moved for two reasons and only one of them
# was new tests. CI used to run 663 of the 692 tests that ran locally, because
# 29 of them skipped without `data/mtg.duckdb`; building a real corpus from
# `tests/tiny_corpus.py` took the CI figure from 82% to 86% without a line of
# new test code, which is to say four of those points had been written all
# along and were simply not being run. The rest came from the CLI's
# corpus-backed commands, the Claude conversation loop, and Forge's setup path.
fail_under = 90

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A skipped test is a test nobody is reading the result of, so the suite is
# not allowed to skip silently. `-ra` prints the reason for every one.
addopts = "-ra"
markers = [
    # The two tests `tests/tiny_corpus.py` genuinely cannot carry: the 32-way
    # colour-combination check (a fixture containing the 32 cards would verify
    # the fixture rather than the table) and the commander-search ordering bug
    # (which needs more cards than the query limit to reproduce at all).
    #
    # Everything else that used to need `data/mtg.duckdb` now builds a real
    # corpus from the fixture instead. This marker exists so the remainder is
    # declared and countable rather than an ad-hoc `pytest.skip` that quietly
    # grows -- `ci.yml` fails the build if the skip count moves.
    "needs_full_corpus: requires a real `mtglab data refresh` corpus, not the fixture",
]

[tool.mypy]
# Strict by default, with a named and shrinking list of exceptions below.
#
# That direction matters more than the starting point. The alternative --
# lax by default, strict where someone opted in -- means a new module is born
# unchecked and nobody notices; this way a new module is strict on the day it
# is written, which is the only day making it strict is free. 24 of the 42
# modules already passed `--strict` the first time it was run, including all of
# `mana.py`, `sim/tier1/` and `sim/tier3/`, so the floor was already high.
#
# Deliberately no `python_version`. Pinning it to the 3.11 floor makes mypy
# parse numpy's bundled stubs with a 3.11 grammar, and they use `type X = ...`
# -- a 3.12 statement -- so the run dies on numpy before ever reaching our
# code. Following the interpreter instead means CI type-checks on 3.12 only,
# the same interpreter it reports coverage on, and for the same reason: a
# second run would print the same answer twice.
files = ["src/mtglab"]
strict = true
# Show the rule name so a failure says which knob it came from.
show_error_codes = true

# The eight modules that do not pass `--strict` yet, with the count at the time
# the checker landed. They are here to be worked down, not to be permanent --
# and until then the *rest* of the package cannot regress, which is the point.
# `check_untyped_defs` still applies to every one of them (that was clean
# across the whole package on day one), so this is a weaker check rather than
# no check.
#
#   cli.py            33     cards/db.py       24     decks/companion   11
#   decks/analyze.py   7     decks/importer.py  4     decks/validate.py  3
#   artifacts/gen      3     api/app.py         3
#
# api/service.py and api/simruns.py graduated 2026-08-12.
[[tool.mypy.overrides]]
module = [
    "mtglab.cli",
    "mtglab.api.app",
    "mtglab.artifacts.generate",
    "mtglab.cards.db",
    "mtglab.decks.analyze",
    "mtglab.decks.companion",
    "mtglab.decks.importer",
    "mtglab.decks.validate",
]
# `strict` is not a per-module setting -- it is shorthand that expands at the
# top level only, so `strict = false` here would be silently ignored and these
# modules would fail the build anyway. The flags it turns on have to be named
# one at a time, which is tedious but at least makes the exemption explicit:
# these five are relaxed, and everything else `strict` implies still applies.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
# The one that stays on. It was clean across the whole package on day one, so
# these modules are still checked -- just not required to be annotated.
check_untyped_defs = true

[tool.ruff]
# Pin the rule set explicitly. Ruff's default selection widened a lot between
# 0.4 and 0.16, so an unconfigured `ruff check` reports different results
# depending on which ruff happens to be installed -- CI included.
target-version = "py311"   # the floor in requires-python, not the local 3.12
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ISC", "DTZ", "BLE"]
ignore = [
    # date.today() datestamps generated markdown. These are local documents,
    # not instants needing timezone-aware arithmetic.
    "DTZ011",
    # %-formatting is deliberate in mana.py: the output contains literal
    # braces ({3}, {G/W}). An f-string would force f"{{{n}}}", which is
    # markedly harder to read in the one place mana costs get stringified.
    "UP031",
    # The nested conditionals in engine.py and validate.py carry explanatory
    # comments between the branches and read better unflattened.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# The __main__ fallback runners catch broadly on purpose, so they can report
# ERROR separately from FAIL when a test raises rather than asserts.
"tests/*" = ["BLE001"]
# The argparse wiring is written as a dense table, one subcommand per line,
# with `;` joining the parser and its first argument. Splitting it doubles the
# length of main() without making the command tree any clearer.
"src/mtglab/cli.py" = ["E702"]
