[project]
name = "mtg-lab"
version = "0.1.0"
description = "Local Magic: the Gathering deckbuilding, simulation and shopping toolkit"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "duckdb>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
mtglab = "mtglab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
