[project]
name = "mtg-lab"
version = "0.1.0"
description = "Local Magic: the Gathering deckbuilding, simulation and shopping toolkit"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "duckdb>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# httpx backs fastapi's TestClient, so the API tests need it. ruff's floor is
# 0.16 because the rule selection in [tool.ruff.lint] names rules added after
# 0.4, and an older ruff would error on the config rather than lint the code.
dev = ["pytest>=8.0", "ruff>=0.16", "httpx>=0.27", "coverage>=7.0"]

[project.scripts]
mtglab = "mtglab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the built frontend inside the package so an install serves the UI
# without a Node toolchain present.
mtglab = ["web_dist/**/*"]

[tool.coverage.run]
source = ["src/mtglab"]
# The __main__ fallback runners in tests/ are not part of the library.
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Not a gate -- a floor, so a large regression is loud while ordinary churn
# is not. Raise it deliberately, do not let it drift down.
fail_under = 80

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Pin the rule set explicitly. Ruff's default selection widened a lot between
# 0.4 and 0.16, so an unconfigured `ruff check` reports different results
# depending on which ruff happens to be installed -- CI included.
target-version = "py311"   # the floor in requires-python, not the local 3.12
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ISC", "DTZ", "BLE"]
ignore = [
    # date.today() datestamps generated markdown. These are local documents,
    # not instants needing timezone-aware arithmetic.
    "DTZ011",
    # %-formatting is deliberate in mana.py: the output contains literal
    # braces ({3}, {G/W}). An f-string would force f"{{{n}}}", which is
    # markedly harder to read in the one place mana costs get stringified.
    "UP031",
    # The nested conditionals in engine.py and validate.py carry explanatory
    # comments between the branches and read better unflattened.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# The __main__ fallback runners catch broadly on purpose, so they can report
# ERROR separately from FAIL when a test raises rather than asserts.
"tests/*" = ["BLE001"]
# The argparse wiring is written as a dense table, one subcommand per line,
# with `;` joining the parser and its first argument. Splitting it doubles the
# length of main() without making the command tree any clearer.
"src/mtglab/cli.py" = ["E702"]
