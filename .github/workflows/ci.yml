name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The `api` extra is not optional here. tests/test_api.py opens with
      # pytest.importorskip("fastapi"), so installing only [dev] skips the
      # entire HTTP layer -- silently, and with a green check.
      - run: pip install -e ".[dev,api]"

      # Fail loudly if that ever stops being true, rather than letting the
      # importorskip quietly disable a whole test module again. hypothesis is
      # checked here too: the property tests are the only thing standing
      # between mana.py and a silently wrong castability answer.
      - name: Test dependencies must be present
        run: python -c "import fastapi, httpx, hypothesis"

      # Run under coverage rather than bare pytest. `fail_under` in
      # pyproject.toml is a floor, not a target: it makes a large regression
      # loud without failing the build over ordinary churn. Coverage is
      # reported on one interpreter only -- the numbers are identical across
      # both, and printing them twice just makes the log harder to read.
      #
      # `pipefail` because the log is teed for the skip check below, and
      # without it a failing pytest would be masked by a succeeding `tee`.
      - name: Tests
        run: |
          set -o pipefail
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            coverage run -m pytest -q | tee pytest.log
            coverage report
          else
            pytest -q | tee pytest.log
          fi

      # The check that would have caught the reason this job was ever green
      # while testing less than the maintainer's laptop did.
      #
      # Until 2026-08-12, 29 tests called `pytest.skip("no corpus available")`
      # because CI has no `data/mtg.duckdb` -- so the whole card-fact surface
      # (swap, add, suggestions, search, the simulators, the Claude tools) was
      # reported as passing while never running. A skipped test is a test
      # nobody reads the result of, and the failure mode is silent by
      # construction: the check stays green as the suite quietly shrinks.
      #
      # `tests/tiny_corpus.py` builds a real DuckDB corpus in about a second,
      # so those tests now run here. Exactly two remain, both carrying the
      # `needs_full_corpus` marker and both explained where they are declared.
      # If that number moves, this fails and somebody has to say why.
      - name: The suite must not skip silently
        run: |
          expected=2
          got=$(grep -c '^SKIPPED' pytest.log || true)
          if [ "$got" != "$expected" ]; then
            echo "::error::expected $expected skipped test(s), got $got"
            echo "A skipped test is a test nobody is reading the result of."
            echo "Either make it run, or mark it needs_full_corpus and raise"
            echo "the expected count here deliberately."
            grep '^SKIPPED' pytest.log || true
            exit 1
          fi
          echo "$got skipped, all declared"

      - run: ruff check src tests

      # Type checking, on 3.12 only. mypy follows the running interpreter
      # rather than a pinned `python_version` (see pyproject.toml for why
      # numpy's stubs force that), so a second run on 3.11 would not be a
      # second opinion -- it would be the same answer with a worse parser.
      - name: Types
        if: matrix.python-version == '3.12'
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Run the typecheck on its own so a type error reports as a type error,
      # not as an opaque build failure. This covers the test files too --
      # tsconfig.app.json includes all of src/.
      #
      # `strict` went on in tsconfig.app.json on 2026-08-12. Before that this
      # step ran with strictNullChecks off, so `possibly undefined` was not an
      # error and a null deref type-checked clean and failed in the browser.
      - run: npx tsc -b
        working-directory: web

      # oxlint has been a devDependency with a `lint` script since the frontend
      # landed, and nothing ever ran it. `--deny-warnings` because a warning
      # nobody is required to look at is a warning nobody looks at -- the two
      # it reported when this was wired up were both dead re-exports.
      - run: npx oxlint --deny-warnings
        working-directory: web

      # Before the build, so a broken component fails as a failing test rather
      # than as a bundle that builds fine and misbehaves in the browser.
      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

      # src/mtglab/web_dist/ is committed so the app runs without Node. That
      # only holds if it actually matches the source -- otherwise someone
      # edits web/src, pushes, and the app quietly serves the old bundle.
      # Output filenames are stable and the build is byte-reproducible, so a
      # clean diff here is the check.
      - name: Committed bundle must match the source
        run: |
          if ! git diff --quiet -- src/mtglab/web_dist; then
            echo "::error::src/mtglab/web_dist/ is stale."
            echo "Rebuild and commit it:  npm --prefix web run build"
            git diff --stat -- src/mtglab/web_dist
            exit 1
          fi
          echo "committed bundle is current"

  # Guard against the two things that must never land in the repo.
  no-secrets-or-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed card data, collections, or credentials
        run: |
          bad=$(git ls-files | grep -Ei \
            '(^data/.*\.(json|duckdb)$|collection|wishlist|inventory|purchases|orders|\.env$|cookies\.json)' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"; echo "$bad"; exit 1
          fi
          echo "clean"

      # The check above is by filename, which catches a committed `.env` and
      # nothing else. A key pasted into a source file, a note, or the built
      # frontend bundle is the likelier accident, so scan contents too.
      - name: Reject API keys pasted into tracked files
        run: |
          # Assembled by concatenation so this workflow does not match its own
          # pattern, and requiring a long body so prose writing the bare prefix
          # does not fail the build. Real keys are far longer than 16 chars.
          pattern="sk-""ant-[A-Za-z0-9_-]{16,}"
          # -I skips binaries; web_dist/ is deliberately in scope, because a key
          # reaching the committed frontend bundle is both public and shipped to
          # every browser.
          bad=$(git grep -nIE "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "An API key looks committed. REVOKE IT in the console first,"
            echo "then remove it from the file and from git history:"
            echo "$bad"
            exit 1
          fi
          echo "no keys in tracked files"
