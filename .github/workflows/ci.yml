name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. `dependency-review.yml` has said this since it landed and
# this file never did, which meant the whole suite ran with whatever the
# repository default happened to be. Nothing here writes: no job pushes an
# image, comments on a PR, or updates a check.
permissions:
  contents: read

# One run per ref. Pushing three times in a minute used to start three full
# builds -- six jobs each, including the arm64 QEMU image build -- and the
# first two were obsolete before they finished. Cancelled on pull requests
# only: a superseded PR run answers a question nobody is asking any more,
# whereas every commit on `main` should keep its own recorded result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous against the normal run (~6 minutes) but far below the 6-hour
    # default. A hung test should cost minutes of runner time, not a morning.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # The dependency set is small but numpy and duckdb are large wheels,
          # and they are re-downloaded on every job of every run without this.
          cache: pip
          cache-dependency-path: pyproject.toml

      # The `api` extra is not optional here. tests/test_api.py opens with
      # pytest.importorskip("fastapi"), so installing only [dev] skips the
      # entire HTTP layer -- silently, and with a green check.
      - run: pip install -e ".[dev,api]"

      # Fail loudly if that ever stops being true, rather than letting the
      # importorskip quietly disable a whole test module again. hypothesis is
      # checked here too: the property tests are the only thing standing
      # between mana.py and a silently wrong castability answer.
      # `argon2` joined the list on 2026-08-12 for the same reason. Without it,
      # tests/test_auth.py, tests/test_auth_api.py, tests/test_cli_users.py and
      # tests/test_isolation.py all skip at import -- and the last of those is
      # the one ADR 5 calls the highest-value test in the auth story.
      - name: Test dependencies must be present
        run: python -c "import fastapi, httpx, hypothesis, argon2"

      # Run under coverage rather than bare pytest. `fail_under` in
      # pyproject.toml is a floor, not a target: it makes a large regression
      # loud without failing the build over ordinary churn. Coverage is
      # reported on one interpreter only -- the numbers are identical across
      # both, and printing them twice just makes the log harder to read.
      #
      # `pipefail` because the log is teed for the skip check below, and
      # without it a failing pytest would be masked by a succeeding `tee`.
      - name: Tests
        run: |
          set -o pipefail
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            coverage run -m pytest -q | tee pytest.log
            coverage report
          else
            pytest -q | tee pytest.log
          fi

      # The check that would have caught the reason this job was ever green
      # while testing less than the maintainer's laptop did.
      #
      # Until 2026-08-12, 29 tests called `pytest.skip("no card pool available")`
      # because CI has no `data/mtg.duckdb` -- so the whole card-fact surface
      # (swap, add, suggestions, search, the simulators, the Claude tools) was
      # reported as passing while never running. A skipped test is a test
      # nobody reads the result of, and the failure mode is silent by
      # construction: the check stays green as the suite quietly shrinks.
      #
      # `tests/tiny_pool.py` builds a real DuckDB pool in about a second,
      # so those tests now run here. Exactly two remain, both carrying the
      # `needs_full_pool` marker and both explained where they are declared.
      # If that number moves, this fails and somebody has to say why.
      - name: The suite must not skip silently
        run: |
          expected=2
          got=$(grep -c '^SKIPPED' pytest.log || true)
          if [ "$got" != "$expected" ]; then
            echo "::error::expected $expected skipped test(s), got $got"
            echo "A skipped test is a test nobody is reading the result of."
            echo "Either make it run, or mark it needs_full_pool and raise"
            echo "the expected count here deliberately."
            grep '^SKIPPED' pytest.log || true
            exit 1
          fi
          echo "$got skipped, all declared"

      - run: ruff check src tests

      # Type checking, on 3.12 only. mypy follows the running interpreter
      # rather than a pinned `python_version` (see pyproject.toml for why
      # numpy's stubs force that), so a second run on 3.11 would not be a
      # second opinion -- it would be the same answer with a worse parser.
      - name: Types
        if: matrix.python-version == '3.12'
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Run the typecheck on its own so a type error reports as a type error,
      # not as an opaque build failure. This covers the test files too --
      # tsconfig.app.json includes all of src/.
      #
      # `strict` went on in tsconfig.app.json on 2026-08-12. Before that this
      # step ran with strictNullChecks off, so `possibly undefined` was not an
      # error and a null deref type-checked clean and failed in the browser.
      - run: npx tsc -b
        working-directory: web

      # oxlint has been a devDependency with a `lint` script since the frontend
      # landed, and nothing ever ran it. `--deny-warnings` because a warning
      # nobody is required to look at is a warning nobody looks at -- the two
      # it reported when this was wired up were both dead re-exports.
      - run: npx oxlint --deny-warnings
        working-directory: web

      # Before the build, so a broken component fails as a failing test rather
      # than as a bundle that builds fine and misbehaves in the browser.
      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

      # src/mtglab/web_dist/ is committed so the app runs without Node. That
      # only holds if it actually matches the source -- otherwise someone
      # edits web/src, pushes, and the app quietly serves the old bundle.
      # Output filenames are stable and the build is byte-reproducible, so a
      # clean diff here is the check.
      - name: Committed bundle must match the source
        run: |
          if ! git diff --quiet -- src/mtglab/web_dist; then
            echo "::error::src/mtglab/web_dist/ is stale."
            echo "Rebuild and commit it:  npm --prefix web run build"
            git diff --stat -- src/mtglab/web_dist
            exit 1
          fi
          echo "committed bundle is current"

  # Guard against the two things that must never land in the repo.
  no-secrets-or-card-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # `app.db` joined this list on 2026-08-12. It holds password hashes and
      # email addresses -- the first personal data the project stores (ADR 16)
      # -- and unlike the pool it is irreplaceable, so a committed one is
      # both a leak and a thing somebody might try to "restore" from git.
      - name: Reject committed card data, collections, or credentials
        run: |
          bad=$(git ls-files | grep -Ei \
            '(^data/.*\.(json|duckdb)$|app\.db|collection|wishlist|inventory|purchases|orders|\.env$|cookies\.json)' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"; echo "$bad"; exit 1
          fi
          echo "clean"

      # The check above is by filename, which catches a committed `.env` and
      # nothing else. A key pasted into a source file, a note, or the built
      # frontend bundle is the likelier accident, so scan contents too.
      - name: Reject API keys pasted into tracked files
        run: |
          # Assembled by concatenation so this workflow does not match its own
          # pattern, and requiring a long body so prose writing the bare prefix
          # does not fail the build. Real keys are far longer than 16 chars.
          pattern="sk-""ant-[A-Za-z0-9_-]{16,}"
          # -I skips binaries; web_dist/ is deliberately in scope, because a key
          # reaching the committed frontend bundle is both public and shipped to
          # every browser.
          bad=$(git grep -nIE "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "An API key looks committed. REVOKE IT in the console first,"
            echo "then remove it from the file and from git history:"
            echo "$bad"
            exit 1
          fi
          echo "no keys in tracked files"

  # The container image. This job is not decoration: the maintainer's machine is
  # macOS 12 on Intel, where Docker Desktop will not install (it supports the
  # three most recent macOS releases) and Homebrew is too stale to build Colima.
  # So this runner is the *only* place the Dockerfile is ever built, and the
  # only place the claims made in it get checked. It builds, it runs the thing,
  # and it asks the image the questions `docs/ENGINEERING.md` §3 and
  # `docs/HOSTING.md` §4 answer in prose.
  #
  # Adding this job means adding `image` to the required checks on `main`;
  # ENGINEERING §5 keeps that list, and a check that is not required is a check
  # that does not gate.
  image:
    runs-on: ubuntu-latest
    # The longest job by far: the arm64 build at the end runs under QEMU. This
    # is a stuck-build ceiling, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # amd64 first, and `load`ed into the daemon, because the smoke test and
      # the scan below need a real image to run rather than a manifest. arm64
      # follows at the end; a multi-arch build cannot be loaded.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sylvan-library:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rule 5, enforced against the artifact rather than against the tree. The
      # `no-secrets-or-card-data` job checks what is *tracked*; this checks what is
      # *shipped*, which is a different thing the moment a `.dockerignore` line
      # is deleted. Scryfall asks that bulk data not be redistributed, and a
      # published image is redistribution.
      - name: The image must contain no card pool
        run: |
          found=$(docker run --rm --entrypoint sh sylvan-library:ci -c \
            'find / -xdev \( -name "*.duckdb" -o -name "*.jsonl.gz" -o -name "*.json.gz" \) 2>/dev/null' )
          if [ -n "$found" ]; then
            echo "::error::card pool data found in the image:"; echo "$found"; exit 1
          fi
          echo "no card pool in the image"

      # The decks ship as a seed, not as the live directory -- MTGLAB_DECKS_DIR
      # points at the volume. If this path moves, HOSTING §4 step 6's copy
      # command is wrong and a fresh instance silently comes up with no decks.
      - name: The decks seed must be where the runbook says
        run: |
          docker run --rm --entrypoint sh sylvan-library:ci -c \
            'test -f /app/decks-seed/arahbo-cats/deck.yaml'
          echo "decks seed present"

      # The tarot art ships as `package-data`, not as part of the built bundle,
      # so nothing else in this pipeline would notice it going missing: the
      # tests read it from the source tree and pass either way. What breaks is
      # only ever the *installed* package, which is only ever built here.
      # 78 exactly -- a glob that half-matches is worse than one that fails.
      - name: The tarot deck must survive being packaged
        run: |
          docker run --rm --entrypoint python sylvan-library:ci -c \
            "import mtglab, pathlib, sys; d = pathlib.Path(mtglab.__file__).parent / 'assets/tarot'; n = len(list(d.glob('*.webp'))); print(d, n, 'cards'); sys.exit(0 if n == 78 else 1)"

      # And they must be served as pictures. `mimetypes` reads the *host's*
      # database, and this image has no `/etc/mime.types` — so `.webp`
      # resolved to nothing and every card went out as
      # `application/octet-stream`. macOS knows the type and so does this
      # runner, which is exactly why neither the suite nor a local browser
      # could see it. `api/app.py` registers it explicitly now; this asserts
      # that the registration is what the *container* ends up doing, which is
      # the only place the question has ever had a different answer.
      - name: A packaged card must resolve as an image, not as bytes
        run: |
          docker run --rm --entrypoint python sylvan-library:ci -c \
            "import mtglab.api.app, mimetypes, sys; t = mimetypes.guess_type('x.webp')[0]; print('webp ->', t); sys.exit(0 if t == 'image/webp' else 1)"

      - name: Run it
        run: |
          docker volume create mtglab-ci-data
          # Auth on, as deployed. No RESEND_API_KEY: `sender_from_env()` is
          # read at call time, not at import, so the app starts -- only the
          # invite and reset routes would refuse. That is the documented
          # behaviour and this pins it.
          docker run -d --name mtglab-ci -p 8080:8080 \
            -e MTGLAB_REQUIRE_AUTH=1 \
            -v mtglab-ci-data:/data \
            sylvan-library:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/health -o health.json; then
              echo "up"; cat health.json; exit 0
            fi
            sleep 2
          done
          echo "::error::the container never answered /api/health"
          docker logs mtglab-ci || true
          exit 1

      # `/api/health` is on PUBLIC_PATHS *and* reports pool state, which is
      # why it is the HEALTHCHECK target. A fresh instance has no card pool and
      # must say so rather than failing: that is the correct state between a
      # deploy and the seeding run, and an image that 500s here would make the
      # platform restart a perfectly healthy machine forever.
      - name: Health answers with auth on, and reports no card pool
        run: |
          grep -q '"pool": *false' health.json
          echo "health reports an unseeded instance, as it should"

      # The gate is a gate. If this ever returns 200 the middleware has stopped
      # refusing before routing, which is the whole of ADR 5's protection.
      - name: A protected route refuses without a session
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/decks)
          [ "$code" = "401" ] || { echo "::error::/api/decks answered $code, want 401"; exit 1; }
          echo "auth is on"

      # The property ENGINEERING §3 asks for, checked on the process that is
      # actually listening rather than on a `USER` line. PID 1 is the app: the
      # entrypoint `exec`s it, so there is no shell left in between.
      - name: The app process is not root
        run: |
          who=$(docker exec mtglab-ci stat -c '%U' /proc/1)
          [ "$who" = "mtglab" ] || { echo "::error::pid 1 runs as $who, want mtglab"; exit 1; }
          # And it can write to its own volume, which is the reason the
          # entrypoint starts as root at all.
          owner=$(docker exec mtglab-ci stat -c '%U' /data)
          [ "$owner" = "mtglab" ] || { echo "::error::/data owned by $owner"; exit 1; }
          docker exec --user mtglab mtglab-ci touch /data/.write-probe
          echo "app runs as $who and can write /data"

      - name: Stop it
        if: always()
        run: docker rm -f mtglab-ci || true

      # ENGINEERING §3: everything this app writes lives under `/data`.
      # `--read-only` is what turns that sentence from a claim into a test. A
      # change that starts writing into the image layer fails here, loudly,
      # instead of succeeding locally and then silently losing every write at
      # the next deploy -- which is the exact failure decks-on-the-volume was
      # moved to avoid.
      #
      # **This does not harden the Fly deployment.** Fly's configuration
      # reference has no read-only root option (checked 2026-08-13; the nearest
      # thing, `persist_rootfs`, is about persistence), so `fly.toml` cannot ask
      # for it and the deployed machine does not run this way. What it hardens
      # is the image on any runtime that *can* express it -- plain `docker run`,
      # podman, Kubernetes -- and, more usefully here, the invariant above.
      #
      # Deliberately a second container rather than a flag on the one above:
      # that one asserts the shape the instance actually runs in, and folding
      # these together would mean neither was tested as deployed.
      #
      # `--tmpfs /tmp` because the standard library expects a writable temp
      # directory and does use it. `/data` is a volume, writable exactly as it
      # is in production, which is the point -- read-only root, writable state.
      - name: It runs with a read-only root filesystem
        run: |
          docker volume create mtglab-ci-ro
          docker run -d --name mtglab-ci-ro -p 8081:8080 \
            --read-only --tmpfs /tmp \
            -e MTGLAB_REQUIRE_AUTH=1 \
            -v mtglab-ci-ro:/data \
            sylvan-library:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8081/api/health -o health-ro.json; then
              echo "up with a read-only root"; cat health-ro.json
              # The entrypoint chowns the volume as root and execs the app as
              # mtglab. Both still have to work with the root read-only, so
              # assert the write it needs rather than trusting a 200.
              docker exec --user mtglab mtglab-ci-ro touch /data/.write-probe
              echo "and /data is still writable"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the container did not come up with a read-only root filesystem"
          docker logs mtglab-ci-ro || true
          exit 1

      - name: Stop the read-only one
        if: always()
        run: docker rm -f mtglab-ci-ro || true

      # Fails the build on HIGH/CRITICAL, per ENGINEERING §3. `ignore-unfixed`
      # because a CVE with no available patch is not something this build can
      # act on -- it would turn the gate into noise that gets disabled.
      #
      # Unpinned, like every other action in this file. ENGINEERING §5's
      # supply-chain list owns moving all of them to commit SHAs; pinning a
      # scanner to an old tag also pins its database schema, which is its own
      # way to end up with a green check that checks nothing.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sylvan-library:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Last, because it is the slowest: arm64 runs under QEMU. It is here at
      # all because the dev machine is Intel and anything this would deploy to
      # is arm64, so "it builds" has to mean both. Nothing is pushed -- there is
      # no registry in this story yet, and publishing is a decision with a
      # signing and provenance conversation attached (ENGINEERING §5).
      - name: Build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
