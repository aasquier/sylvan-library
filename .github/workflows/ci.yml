name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The manual button. Running the whole workflow rather than the deploy job
  # alone is deliberate: "deploy whatever is on main right now" should still
  # mean "having checked it", and a button that skips the suite is a button
  # that eventually gets used to ship something red.
  workflow_dispatch:

# Least privilege. `dependency-review.yml` has said this since it landed and
# this file never did, which meant the whole suite ran with whatever the
# repository default happened to be. Nothing here writes: no job pushes an
# image, comments on a PR, or updates a check.
permissions:
  contents: read

# One run per ref. Pushing three times in a minute used to start three full
# builds -- six jobs each, including the arm64 QEMU image build -- and the
# first two were obsolete before they finished. Cancelled on pull requests
# only: a superseded PR run answers a question nobody is asking any more,
# whereas every commit on `main` should keep its own recorded result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous against the normal run (~6 minutes) but far below the 6-hour
    # default. A hung test should cost minutes of runner time, not a morning.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # The dependency set is small but numpy and duckdb are large wheels,
          # and they are re-downloaded on every job of every run without this.
          cache: pip
          cache-dependency-path: pyproject.toml

      # The `api` extra is not optional here. tests/test_api.py opens with
      # pytest.importorskip("fastapi"), so installing only [dev] skips the
      # entire HTTP layer -- silently, and with a green check.
      - run: pip install -e ".[dev,api]"

      # Fail loudly if that ever stops being true, rather than letting the
      # importorskip quietly disable a whole test module again. hypothesis is
      # checked here too: the property tests are the only thing standing
      # between mana.py and a silently wrong castability answer.
      # `argon2` joined the list on 2026-08-12 for the same reason. Without it,
      # tests/test_auth.py, tests/test_auth_api.py, tests/test_cli_users.py and
      # tests/test_isolation.py all skip at import -- and the last of those is
      # the one ADR 5 calls the highest-value test in the auth story.
      - name: Test dependencies must be present
        run: python -c "import fastapi, httpx, hypothesis, argon2"

      # Run under coverage rather than bare pytest. `fail_under` in
      # pyproject.toml is a floor, not a target: it makes a large regression
      # loud without failing the build over ordinary churn. Coverage is
      # reported on one interpreter only -- the numbers are identical across
      # both, and printing them twice just makes the log harder to read.
      #
      # `pipefail` because the log is teed for the skip check below, and
      # without it a failing pytest would be masked by a succeeding `tee`.
      - name: Tests
        run: |
          set -o pipefail
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            # `--durations` on one interpreter only, like coverage and for the
            # same reason. It is how the tiny_pool rebuild -- a third of the
            # suite's runtime hiding in fixture setup -- was found, and a
            # regression of that shape is visible here or nowhere.
            coverage run -m pytest -q --durations=15 | tee pytest.log
            coverage report
          else
            pytest -q | tee pytest.log
          fi

      # The check that would have caught the reason this job was ever green
      # while testing less than the maintainer's laptop did.
      #
      # Until 2026-08-12, 29 tests called `pytest.skip("no card pool available")`
      # because CI has no `data/mtg.duckdb` -- so the whole card-fact surface
      # (swap, add, suggestions, search, the simulators, the Claude tools) was
      # reported as passing while never running. A skipped test is a test
      # nobody reads the result of, and the failure mode is silent by
      # construction: the check stays green as the suite quietly shrinks.
      #
      # `tests/tiny_pool.py` builds a real DuckDB pool in about a second,
      # so those tests now run here. Exactly two remain, both carrying the
      # `needs_full_pool` marker and both explained where they are declared.
      # If that number moves, this fails and somebody has to say why.
      - name: The suite must not skip silently
        run: |
          expected=2
          got=$(grep -c '^SKIPPED' pytest.log || true)
          if [ "$got" != "$expected" ]; then
            echo "::error::expected $expected skipped test(s), got $got"
            echo "A skipped test is a test nobody is reading the result of."
            echo "Either make it run, or mark it needs_full_pool and raise"
            echo "the expected count here deliberately."
            grep '^SKIPPED' pytest.log || true
            exit 1
          fi
          echo "$got skipped, all declared"

      - run: ruff check src tests

      # Type checking, on 3.12 only. mypy follows the running interpreter
      # rather than a pinned `python_version` (see pyproject.toml for why
      # numpy's stubs force that), so a second run on 3.11 would not be a
      # second opinion -- it would be the same answer with a worse parser.
      - name: Types
        if: matrix.python-version == '3.12'
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Run the typecheck on its own so a type error reports as a type error,
      # not as an opaque build failure. This covers the test files too --
      # tsconfig.app.json includes all of src/.
      #
      # `strict` went on in tsconfig.app.json on 2026-08-12. Before that this
      # step ran with strictNullChecks off, so `possibly undefined` was not an
      # error and a null deref type-checked clean and failed in the browser.
      - run: npx tsc -b
        working-directory: web

      # oxlint has been a devDependency with a `lint` script since the frontend
      # landed, and nothing ever ran it. `--deny-warnings` because a warning
      # nobody is required to look at is a warning nobody looks at -- the two
      # it reported when this was wired up were both dead re-exports.
      - run: npx oxlint --deny-warnings
        working-directory: web

      # Before the build, so a broken component fails as a failing test rather
      # than as a bundle that builds fine and misbehaves in the browser.
      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web

      # src/mtglab/web_dist/ is committed so the app runs without Node. That
      # only holds if it actually matches the source -- otherwise someone
      # edits web/src, pushes, and the app quietly serves the old bundle.
      # Output filenames are stable and the build is byte-reproducible, so a
      # clean diff here is the check.
      - name: Committed bundle must match the source
        run: |
          if ! git diff --quiet -- src/mtglab/web_dist; then
            echo "::error::src/mtglab/web_dist/ is stale."
            echo "Rebuild and commit it:  npm --prefix web run build"
            git diff --stat -- src/mtglab/web_dist
            exit 1
          fi
          echo "committed bundle is current"

  # Guard against the two things that must never land in the repo.
  no-secrets-or-card-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # `app.db` joined this list on 2026-08-12. It holds password hashes and
      # email addresses -- the first personal data the project stores (ADR 16)
      # -- and unlike the pool it is irreplaceable, so a committed one is
      # both a leak and a thing somebody might try to "restore" from git.
      #
      # The pool rules stopped being anchored to `data/` on 2026-08-16, found
      # by White's run and closed by Red's. `^data/.*\.duckdb$` only ever asked
      # where a file was, and the thing that makes a committed pool a rule 5
      # violation is what it *is* -- so a pool built into `tests/fixtures/` or
      # dropped at the repository root passed a scan named after it. The
      # `.jsonl.gz`/`.json.gz` pair is the same hole one step upstream: those
      # are Scryfall's bulk downloads, which the `image` job already refuses to
      # find *inside the container* and which nothing refused in the tree.
      #
      # Note which extensions may go global and which may not, because it is
      # the whole reason the first alternative stays: nothing legitimate in
      # this repository is named `.duckdb`, `.jsonl.gz` or `.json.gz`, so those
      # can match anywhere and cannot false-positive. Bare `.json` emphatically
      # cannot -- `package.json`, `package-lock.json` and `tsconfig` are all
      # tracked -- so it stays pinned to `data/`, where a JSON file is Scryfall's
      # and nothing else. Checked against all 418 tracked files: the widened
      # pattern matches exactly what the old one did, which is nothing.
      - name: Reject committed card data, collections, or credentials
        run: |
          bad=$(git ls-files | grep -Ei \
            '(^data/.*\.(json|duckdb)$|\.duckdb$|\.jsonl\.gz$|\.json\.gz$|app\.db|collection|wishlist|inventory|purchases|orders|\.env$|cookies\.json)' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"; echo "$bad"; exit 1
          fi
          echo "clean"

      # The check above is by filename, which catches a committed `.env` and
      # nothing else. A key pasted into a source file, a note, or the built
      # frontend bundle is the likelier accident, so scan contents too.
      - name: Reject API keys pasted into tracked files
        run: |
          # Assembled by concatenation so this workflow does not match its own
          # pattern, and requiring a long body so prose writing the bare prefix
          # does not fail the build. Real keys are far longer than 16 chars.
          pattern="sk-""ant-[A-Za-z0-9_-]{16,}"
          # -I skips binaries; web_dist/ is deliberately in scope, because a key
          # reaching the committed frontend bundle is both public and shipped to
          # every browser.
          bad=$(git grep -nIE "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "An API key looks committed. REVOKE IT in the console first,"
            echo "then remove it from the file and from git history:"
            echo "$bad"
            exit 1
          fi
          echo "no keys in tracked files"

  # The contract suite, against a *real* server (docs/go-migration/PLAN.md,
  # section 5). `tests/contract/` runs in-process inside `test` above like
  # every other HTTP test; this job runs the same files with `--live`, which
  # seeds a scratch directory, starts `mtglab ui` on it in a child process --
  # the exact command the container's `CMD` runs -- and drives it over TCP.
  # Nothing on the far side of the socket is stubbed. That is the mode the Go
  # migration needs: from Phase 2 the same suite runs against the Go front
  # door with Python behind it, and at retirement against Go alone, and a
  # harness that had only ever been exercised in-process would be proven for
  # the first time on the day it mattered.
  #
  # One job rather than a step in `test`, so a red contract reads as "the
  # wire changed" and not as "some test failed", and so the matrix does not
  # run it twice. Python 3.12 only, for the same reason `test` type-checks on
  # one interpreter: the wire does not depend on which one served it.
  #
  # Adding this job was two steps here and is three in all (the `image` job's
  # note, and `tests/test_packaging.py`): it is in the deploy's `needs`
  # below, and it is **not yet a required check on main** -- that is a
  # repository setting, ENGINEERING section 5 has the read-back command, and it
  # is Aaron's to set.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,api]"
      - name: The contract suite, over TCP against a live mtglab ui
        run: pytest tests/contract --live -q -p no:cacheprovider

  # The container image. This job is not decoration: the maintainer's machine is
  # macOS 12 on Intel, where Docker Desktop will not install (it supports the
  # three most recent macOS releases) and Homebrew is too stale to build Colima.
  # So this runner is the *only* place the Dockerfile is ever built, and the
  # only place the claims made in it get checked. It builds, it runs the thing,
  # and it asks the image the questions `docs/ENGINEERING.md` §3 and
  # `docs/HOSTING.md` §4 answer in prose.
  #
  # Adding this job means adding `image` to the required checks on `main`;
  # ENGINEERING §5 keeps that list, and a check that is not required is a check
  # that does not gate.
  image:
    runs-on: ubuntu-latest
    # amd64 only since 2026-08-19. arm64 used to run here at the end, under
    # QEMU, and cost 182 of this job's 302 seconds -- 60% of the longest job
    # in the pipeline, emulating an architecture nothing deploys to: the live
    # machine answers `x86_64` and the arm64 manifest was never pushed. It is
    # now `image-arm64` below, on a native runner. The ceiling stays generous
    # because it is a stuck-build ceiling, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No QEMU here any more -- this runner is amd64 and so is what it builds.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # `load`ed into the daemon, because every check below needs a real image
      # to run rather than a manifest -- which is also why this is the job
      # that keeps them: a multi-arch build cannot be loaded, so the arm64
      # job can build and nothing more.
      #
      # The cache scope is named per architecture. Left at the default, the
      # two jobs share one scope and each evicts the other's layers on every
      # run, which is a cache that costs storage and returns nothing.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sylvan-library:ci
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64

      # The Forge worker image (ADR 35). Built here so a pull request that
      # breaks `Dockerfile.forge` is red before it merges — this Mac cannot
      # build any image, so this step is the only pre-merge proof there is.
      # Build-only: the smoke checks above interrogate the *app* image, and
      # the worker's contract (the shim answers, Forge runs) can only be
      # proven by the machine itself.
      #
      # Deliberately **not** scanned by Trivy, and that is a decision rather
      # than an omission: the distribution is upstream's jar-with-dependencies,
      # so a fixable CVE in a library Forge bundles would red this required
      # check forever with nothing we could patch. The worker is reachable
      # only over the private network, token-gated, and runs for minutes at a
      # time; the app image — the one the internet talks to — keeps its scan.
      - name: Build the Forge worker image (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.forge
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=forge-amd64
          cache-to: type=gha,mode=max,scope=forge-amd64

      # Rule 5, enforced against the artifact rather than against the tree. The
      # `no-secrets-or-card-data` job checks what is *tracked*; this checks what is
      # *shipped*, which is a different thing the moment a `.dockerignore` line
      # is deleted. Scryfall asks that bulk data not be redistributed, and a
      # published image is redistribution.
      - name: The image must contain no card pool
        run: |
          found=$(docker run --rm --entrypoint sh sylvan-library:ci -c \
            'find / -xdev \( -name "*.duckdb" -o -name "*.jsonl.gz" -o -name "*.json.gz" \) 2>/dev/null' )
          if [ -n "$found" ]; then
            echo "::error::card pool data found in the image:"; echo "$found"; exit 1
          fi
          echo "no card pool in the image"

      # Decks are live app data (ADR 30) and must not ship in the image at
      # all: the volume is the only copy an instance should have, and a deck
      # baked into a layer would shadow it with stale state. `.dockerignore`
      # excludes `decks/`; this is the check that it keeps doing so even
      # though a CI checkout has no decks to leak in the first place.
      - name: The image must contain no decks
        run: |
          found=$(docker run --rm --entrypoint sh sylvan-library:ci -c \
            'find / -xdev -name "deck.yaml" 2>/dev/null' )
          if [ -n "$found" ]; then
            echo "::error::deck data found in the image:"; echo "$found"; exit 1
          fi
          echo "no decks in the image"

      # The tarot art ships as `package-data`, not as part of the built bundle,
      # so nothing else in this pipeline would notice it going missing: the
      # tests read it from the source tree and pass either way. What breaks is
      # only ever the *installed* package, which is only ever built here.
      # 78 exactly -- a glob that half-matches is worse than one that fails.
      - name: The tarot deck must survive being packaged
        run: |
          docker run --rm --entrypoint python sylvan-library:ci -c \
            "import mtglab, pathlib, sys; d = pathlib.Path(mtglab.__file__).parent / 'assets/tarot'; n = len(list(d.glob('*.webp'))); print(d, n, 'cards'); sys.exit(0 if n == 78 else 1)"

      # And they must be served as pictures. `mimetypes` reads the *host's*
      # database, and this image has no `/etc/mime.types` — so `.webp`
      # resolved to nothing and every card went out as
      # `application/octet-stream`. macOS knows the type and so does this
      # runner, which is exactly why neither the suite nor a local browser
      # could see it. `api/app.py` registers it explicitly now; this asserts
      # that the registration is what the *container* ends up doing, which is
      # the only place the question has ever had a different answer.
      - name: A packaged card must resolve as an image, not as bytes
        run: |
          docker run --rm --entrypoint python sylvan-library:ci -c \
            "import mtglab.api.app, mimetypes, sys; t = mimetypes.guess_type('x.webp')[0]; print('webp ->', t); sys.exit(0 if t == 'image/webp' else 1)"

      - name: Run it
        run: |
          docker volume create mtglab-ci-data
          # Auth on, as deployed. No RESEND_API_KEY: `sender_from_env()` is
          # read at call time, not at import, so the app starts -- only the
          # invite and reset routes would refuse. That is the documented
          # behaviour and this pins it.
          docker run -d --name mtglab-ci -p 8080:8080 \
            -e MTGLAB_REQUIRE_AUTH=1 \
            -v mtglab-ci-data:/data \
            sylvan-library:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/health -o health.json; then
              echo "up"; cat health.json; exit 0
            fi
            sleep 2
          done
          echo "::error::the container never answered /api/health"
          docker logs mtglab-ci || true
          exit 1

      # `/api/health` is on PUBLIC_PATHS *and* reports pool state, which is
      # why it is the HEALTHCHECK target. A fresh instance has no card pool and
      # must say so rather than failing: that is the correct state between a
      # deploy and the seeding run, and an image that 500s here would make the
      # platform restart a perfectly healthy machine forever.
      - name: Health answers with auth on, and reports no card pool
        run: |
          grep -q '"pool": *false' health.json
          echo "health reports an unseeded instance, as it should"

      # The gate is a gate. If this ever returns 200 the middleware has stopped
      # refusing before routing, which is the whole of ADR 5's protection.
      - name: A protected route refuses without a session
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/decks)
          [ "$code" = "401" ] || { echo "::error::/api/decks answered $code, want 401"; exit 1; }
          echo "auth is on"

      # The property ENGINEERING §3 asks for, checked on the process that is
      # actually listening rather than on a `USER` line. PID 1 is the app: the
      # entrypoint `exec`s it, so there is no shell left in between.
      - name: The app process is not root
        run: |
          who=$(docker exec mtglab-ci stat -c '%U' /proc/1)
          [ "$who" = "mtglab" ] || { echo "::error::pid 1 runs as $who, want mtglab"; exit 1; }
          # And it can write to its own volume, which is the reason the
          # entrypoint starts as root at all.
          owner=$(docker exec mtglab-ci stat -c '%U' /data)
          [ "$owner" = "mtglab" ] || { echo "::error::/data owned by $owner"; exit 1; }
          docker exec --user mtglab mtglab-ci touch /data/.write-probe
          echo "app runs as $who and can write /data"

      - name: Stop it
        if: always()
        run: docker rm -f mtglab-ci || true

      # ENGINEERING §3: everything this app writes lives under `/data`.
      # `--read-only` is what turns that sentence from a claim into a test. A
      # change that starts writing into the image layer fails here, loudly,
      # instead of succeeding locally and then silently losing every write at
      # the next deploy -- which is the exact failure decks-on-the-volume was
      # moved to avoid.
      #
      # **This does not harden the Fly deployment.** Fly's configuration
      # reference has no read-only root option (checked 2026-08-13; the nearest
      # thing, `persist_rootfs`, is about persistence), so `fly.toml` cannot ask
      # for it and the deployed machine does not run this way. What it hardens
      # is the image on any runtime that *can* express it -- plain `docker run`,
      # podman, Kubernetes -- and, more usefully here, the invariant above.
      #
      # Deliberately a second container rather than a flag on the one above:
      # that one asserts the shape the instance actually runs in, and folding
      # these together would mean neither was tested as deployed.
      #
      # `--tmpfs /tmp` because the standard library expects a writable temp
      # directory and does use it. `/data` is a volume, writable exactly as it
      # is in production, which is the point -- read-only root, writable state.
      - name: It runs with a read-only root filesystem
        run: |
          docker volume create mtglab-ci-ro
          docker run -d --name mtglab-ci-ro -p 8081:8080 \
            --read-only --tmpfs /tmp \
            -e MTGLAB_REQUIRE_AUTH=1 \
            -v mtglab-ci-ro:/data \
            sylvan-library:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8081/api/health -o health-ro.json; then
              echo "up with a read-only root"; cat health-ro.json
              # The entrypoint chowns the volume as root and execs the app as
              # mtglab. Both still have to work with the root read-only, so
              # assert the write it needs rather than trusting a 200.
              docker exec --user mtglab mtglab-ci-ro touch /data/.write-probe
              echo "and /data is still writable"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the container did not come up with a read-only root filesystem"
          docker logs mtglab-ci-ro || true
          exit 1

      - name: Stop the read-only one
        if: always()
        run: docker rm -f mtglab-ci-ro || true

      # Fails the build on HIGH/CRITICAL, per ENGINEERING §3. `ignore-unfixed`
      # because a CVE with no available patch is not something this build can
      # act on -- it would turn the gate into noise that gets disabled.
      #
      # This note used to read "unpinned, like every other action in this
      # file", and both halves of that are now false: ENGINEERING §5's
      # supply-chain item landed and all eleven action references here are
      # commit SHAs with the version in a trailing comment.
      #
      # The worry it recorded was real and turned out not to apply -- pinning a
      # scanner to an old tag can pin its vulnerability database too, which is
      # its own way to end up with a green check that checks nothing. It does
      # not happen here, and the run log says why rather than the docs: this
      # step restores `trivy-binary-v0.70.0` from cache and then a *separate*
      # `cache-trivy-<today>` key. The database is fetched at run time and
      # keyed on the date, so the pin holds the action still and the data still
      # moves every day.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sylvan-library:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Last, because it is the slowest: arm64 runs under QEMU. It is here at
      # all because the dev machine is Intel and anything this would deploy to
      # is arm64, so "it builds" has to mean both. Nothing is pushed -- there is
      # no registry in this story yet, and publishing is a decision with a
      # signing and provenance conversation attached (ENGINEERING §5).
  # arm64, built natively rather than emulated. Split out of `image` on
  # 2026-08-19: under QEMU this build was 182 of that job's 302 seconds, and
  # the thing it was proving -- that the Dockerfile is architecture-honest --
  # does not need an emulator to prove it. GitHub's arm64 runners went GA for
  # public repositories on 2025-08-07 and are free for them, so this costs
  # nothing but a second runner.
  #
  # It builds and stops. The pool, deck, art and smoke checks all live in
  # `image` and all need a loaded image, which a cross-architecture build
  # cannot give this runner -- and running them twice would prove the same
  # `.dockerignore` twice.
  #
  # Nothing here pushes. The live machine answers `x86_64`; this is the job
  # that means a move to arm would be a deploy rather than a porting session.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build (linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64

  # Continuous deployment to the Fly instance. Added 2026-08-14, because the
  # alternative was a person running `fly deploy` from a laptop and remembering
  # to -- and the deploy that gets forgotten is the one where `main` and the
  # running instance quietly disagree. The card pool rename is exactly that
  # shape: `/api/health` answers a different field name on either side of it.
  #
  # `needs` is the whole safety argument. This job cannot start until every
  # check above is green, so it is *structurally* unable to deploy something
  # that failed one -- rather than relying on branch protection, which governs
  # merging and has nothing to say about a workflow_dispatch run.
  deploy:
    needs: [test, frontend, no-secrets-or-card-data, contract, image, image-arm64]
    # Two conditions, and the ref one is deliberately outside the event check.
    #
    # Never from a pull request: a fork's PR must not be able to reach the
    # instance, and `secrets.FLY_API_TOKEN` is not exposed to one anyway.
    #
    # And never from a branch. This was wrong until 2026-08-14: the ref check
    # sat on the `push` arm alone, so a `workflow_dispatch` from *any* branch
    # deployed that branch -- and the run reads as an ordinary deploy in the
    # Actions list, because it is the same workflow with the same job names.
    # `needs` does not help here; a feature branch can be perfectly green and
    # still be the wrong thing to put on the instance.
    #
    # What makes it worth a guard rather than a note is that it is not
    # recoverable by redeploying. `auth/db.py`'s ladder is forward-only (ADR
    # 23), so a branch carrying a schema change migrates the volume on boot and
    # deploying `main` afterwards does not migrate it back.
    #
    # The trigger itself stays open on purpose: dispatching the *suite* on a
    # branch is a reasonable thing to want, and it is only the deploy job that
    # must refuse. ADR 23's manual button is unchanged -- it just has to be
    # pointed at `main`, which is what it always meant.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, ever. The workflow-level group already serialises
    # per ref, but this states the invariant that actually matters rather than
    # leaving it as a side effect of that one.
    concurrency:
      group: deploy-sylvan-library
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # 1.6

      # `--local-only` builds here and pushes the result to Fly's registry.
      # The alternative, `--remote-only`, provisions a builder Machine on the
      # account and bills for it; this runner is already paid for and already
      # has buildx. Note the image is therefore built twice per run -- once by
      # the `image` job for the two-architecture check, once here for the one
      # architecture actually deployed. That is a few minutes, not a bug, and
      # collapsing them means publishing to a registry, which ENGINEERING §5
      # keeps behind a signing and provenance conversation.
      #
      # There is one machine and one volume, so Fly cannot roll: this stops the
      # instance and starts the new one. A few seconds of downtime per deploy
      # is inherent to that shape and was equally true by hand.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --local-only

      # A deploy that returns success and an instance that works are different
      # facts, and the gap between them is where the interesting failures live.
      # Three assertions, each pinning a distinct one:
      #
      #   200         -- it is up and answering at all
      #   "pool":true -- the volume is mounted AND the card pool survived. A
      #                  fresh or unmounted volume answers false, which is the
      #                  correct state for a new instance and a catastrophe for
      #                  this one.
      #   decks > 0   -- the decks on the volume are still there. `deck.yaml`
      #                  is written by the app's editing routes, so a deploy
      #                  that lost them loses edits that exist nowhere else.
      #
      # Retried, because the health check has a 10s grace period and the first
      # request after a replace can land before the app is listening.
      - name: The instance must be up, seeded, and still holding its decks
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://sylvan-libraries.com/api/health \
                 -o health.json; then
              break
            fi
            echo "attempt $attempt: no answer yet"
            sleep 5
          done
          if [ ! -s health.json ]; then
            echo "::error::the instance never answered /api/health after deploy"
            exit 1
          fi
          cat health.json
          python3 - <<'PY'
          import json, sys
          h = json.load(open("health.json"))
          bad = []
          if not h.get("pool"):
              bad.append("no card pool -- is the volume mounted?")
          if not h.get("decks"):
              bad.append("no decks -- the volume may have been replaced")
          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          print(f"up: {h['oracle_cards']} oracle cards, {h['decks']} decks")
          PY

      # ---- The Forge worker (ADR 35's second half) -----------------------
      #
      # Build the worker image, push it to Fly's registry, and point the
      # `forge-worker` machine at it. Three things worth stating:
      #
      # * `registry.fly.io` is the app's own private registry — the same one
      #   `flyctl deploy --local-only` above just pushed to. This is not the
      #   public publishing ENGINEERING §5 keeps behind a signing
      #   conversation.
      # * The sync starts the machine once so the *host* pulls the image now,
      #   then stops it. Without that, the first match after a deploy would
      #   pay the pull inside somebody's request thread — the exact failure
      #   keeping the machine pre-created is meant to prevent.
      # * The machine carries no `fly_process_group` metadata, so `flyctl
      #   deploy` (which manages process groups from `fly.toml`) never
      #   touches it; this step is its whole lifecycle.
      #
      # After the smoke test on purpose: the app deploy is proven first, and
      # a red worker sync is feedback about the worker, not a rollback of the
      # app.
      - name: Log docker in to Fly's registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # The same cache scope the `image` job writes, so this is mostly a
      # cache replay: the Forge download layer in particular (~300MB from
      # GitHub) should be fetched once per Forge version, not once per deploy.
      - name: Push the Forge worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.forge
          platforms: linux/amd64
          push: true
          tags: registry.fly.io/sylvan-library:forge-worker-${{ github.sha }}
          cache-from: type=gha,scope=forge-amd64

      - name: Point the forge-worker machine at it, and put it to sleep
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="registry.fly.io/sylvan-library:forge-worker-${GITHUB_SHA}"
          API="https://api.machines.dev/v1/apps/sylvan-library"
          AUTH="Authorization: Bearer $FLY_API_TOKEN"

          # Dedicated CPU is ADR 35's core sizing argument: on throttled
          # shared cores the measured tail stretches into the clock and
          # clock-outs are corrupted measurements, not slow ones. 2 vCPUs and
          # 4GB against a 3GB JVM heap ceiling (the shim's default) — resize
          # against measurement, not upward by reflex.
          config=$(jq -n --arg img "$IMAGE" '{
            image: $img,
            guest: {cpu_kind: "performance", cpus: 2, memory_mb: 4096},
            restart: {policy: "no"},
            auto_destroy: false,
            metadata: {mtglab_role: "forge-worker"}
          }')

          # Two facts about the Machines API, both learned from live runs
          # rather than docs: `/wait` caps its `timeout` at 60 and answers
          # 400 above it (run 1), and `start` answers 412 while a machine is
          # mid-transition — including the moments after `update` returns —
          # so a single start attempt against a stopped machine can lose the
          # race and leave it asleep forever (run 2). The cure for both is
          # one loop that reads the state and *nudges as it polls*: a
          # `stopped` machine is started again on every pass, a
          # transitioning one is simply waited out, and the loop converges
          # from any starting point. Proven against the real machine before
          # this landed: stopped -> started in one cycle, ~5s.
          wake() {
            state=""
            for _ in $(seq 1 60); do
              state=$(curl -fsS -H "$AUTH" "$API/machines/$id" \
                | jq -r '.state')
              case "$state" in
                started) return 0 ;;
                stopped)
                  curl -fsS -X POST -H "$AUTH" "$API/machines/$id/start" \
                    > /dev/null || true ;;
              esac
              sleep 5
            done
            echo "::error::forge-worker never started (state: $state)"
            return 1
          }

          id=$(curl -fsS -H "$AUTH" "$API/machines" \
            | jq -r '.[] | select(.name=="forge-worker") | .id' | head -1)
          if [ -z "$id" ]; then
            # Create launches the machine itself; wake() just watches it up.
            id=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "$(jq -n --argjson c "$config" \
                    '{name: "forge-worker", region: "iad", config: $c}')" \
              "$API/machines" | jq -r '.id')
            echo "created forge-worker machine $id"
          else
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "$(jq -n --argjson c "$config" '{config: $c}')" \
              "$API/machines/$id" > /dev/null
            echo "updated forge-worker machine $id"
          fi

          # Wake it so the image lands on the host, then put it to sleep —
          # stopped-when-idle is the steady state and per-second billing is
          # the point.
          wake
          curl -fsS -X POST -H "$AUTH" "$API/machines/$id/stop" > /dev/null
          for _ in $(seq 1 24); do
            state=$(curl -fsS -H "$AUTH" "$API/machines/$id" \
              | jq -r '.state')
            [ "$state" = "stopped" ] && break
            sleep 5
          done
          echo "forge-worker holds $IMAGE, state: $state"

      # For the log, so a bad deploy has something to roll back *to* without
      # anybody having to reconstruct which release was last good.
      - name: Releases
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl releases --app sylvan-library | head -10

      # The same move `claude/client.py`'s `explain()` makes for a 401: a
      # credential that lapsed reads exactly like an integration that broke,
      # and the person reading this will have forgotten the token had a
      # lifetime at all. `FLY_API_TOKEN` is deliberately app-scoped and
      # deliberately *not* the 20-year default, so it will expire on a date
      # nobody has in mind -- name the date rather than making them find it.
      - name: If that failed, read this first
        if: failure()
        run: |
          echo "Deploy failed. Two things to rule out before debugging the app:"
          echo
          echo "1. FLY_API_TOKEN expires 2027-08-14. An expired or missing"
          echo "   token fails as an auth error, which reads like a broken"
          echo "   integration rather than a lapsed credential. Rotate with:"
          echo
          echo "     fly tokens create deploy -a sylvan-library \\"
          echo "       -n github-actions-deploy -x 8760h"
          echo "     gh secret set FLY_API_TOKEN --repo aasquier/sylvan-library"
          echo
          echo "2. If flyctl succeeded and the smoke test did not, the instance"
          echo "   is up but wrong -- most likely the volume. Check the health"
          echo "   payload above: \"pool\": false means it is not mounted, and a"
          echo "   deck count of 0 means the decks on it are gone. Neither is"
          echo "   fixed by redeploying. docs/HOSTING.md section 5 has the runbook."
