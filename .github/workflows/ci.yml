name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The `api` extra is not optional here. tests/test_api.py opens with
      # pytest.importorskip("fastapi"), so installing only [dev] skips the
      # entire HTTP layer -- silently, and with a green check.
      - run: pip install -e ".[dev,api]"

      # Fail loudly if that ever stops being true, rather than letting the
      # importorskip quietly disable a whole test module again. hypothesis is
      # checked here too: the property tests are the only thing standing
      # between mana.py and a silently wrong castability answer.
      - name: Test dependencies must be present
        run: python -c "import fastapi, httpx, hypothesis"

      # Run under coverage rather than bare pytest. `fail_under` in
      # pyproject.toml is a floor, not a target: it makes a large regression
      # loud without failing the build over ordinary churn. Coverage is
      # reported on one interpreter only -- the numbers are identical across
      # both, and printing them twice just makes the log harder to read.
      - name: Tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            coverage run -m pytest -q && coverage report
          else
            pytest -q
          fi

      - run: ruff check src tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Run the typecheck on its own so a type error reports as a type error,
      # not as an opaque build failure.
      - run: npx tsc -b
        working-directory: web

      - run: npm run build
        working-directory: web

      # src/mtglab/web_dist/ is committed so the app runs without Node. That
      # only holds if it actually matches the source -- otherwise someone
      # edits web/src, pushes, and the app quietly serves the old bundle.
      # Output filenames are stable and the build is byte-reproducible, so a
      # clean diff here is the check.
      - name: Committed bundle must match the source
        run: |
          if ! git diff --quiet -- src/mtglab/web_dist; then
            echo "::error::src/mtglab/web_dist/ is stale."
            echo "Rebuild and commit it:  npm --prefix web run build"
            git diff --stat -- src/mtglab/web_dist
            exit 1
          fi
          echo "committed bundle is current"

  # Guard against the two things that must never land in the repo.
  no-secrets-or-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed card data, collections, or credentials
        run: |
          bad=$(git ls-files | grep -Ei \
            '(^data/.*\.(json|duckdb)$|collection|wishlist|inventory|purchases|orders|\.env$|cookies\.json)' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"; echo "$bad"; exit 1
          fi
          echo "clean"
