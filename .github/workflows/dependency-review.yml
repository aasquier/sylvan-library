# Refuses a PR that introduces a dependency with a known vulnerability or an
# unacceptable licence. Only meaningful on pull_request -- it diffs the
# dependency graph between base and head, so there is nothing for it to do on
# a push to main.
#
# Not yet a required check on `main`. Making it one is a settings change, not
# a workflow change -- ENGINEERING §5 records why the second step is the one
# that gets forgotten.
name: dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
