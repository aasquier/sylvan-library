# Refuses a PR that introduces a dependency with a known vulnerability or an
# unacceptable licence. Only meaningful on pull_request -- it diffs the
# dependency graph between base and head, so there is nothing for it to do on
# a push to main.
#
# Required on `main` since 2026-08-14. The context is the job id below,
# `dependency-review`, and not this workflow's `name:` -- renaming either the
# job or this file means updating the protection setting in the same change,
# or the check stops gating while still appearing to pass. ENGINEERING §5.
name: dependency review

on:
  pull_request:

permissions:
  contents: read

# Unconditionally cancelled, unlike `ci.yml` and `codeql.yml`, because this
# workflow only ever runs on `pull_request` -- there is no `main` run whose
# recorded result is worth keeping, so there is nothing for the event check
# those two make to protect.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # It diffs two dependency graphs and takes about twelve seconds. This is a
    # stuck-job ceiling, not a target -- the point is that a hang costs minutes
    # of runner time rather than the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
