# Dependency updates, grouped so a week's bumps arrive as one reviewable PR
# per ecosystem rather than ten. Actions are pinned by commit SHA in the
# workflows (ENGINEERING §5); Dependabot understands the `# vX.Y.Z` comment
# convention and keeps both the SHA and the comment current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # `torch` is pinned exact on purpose and must not be bumped here.
      # tools/pyproject.toml's `depth` extra argues it: 2.2.2 is the last torch
      # with macOS x86_64 wheels at all, which is this machine's ceiling
      # (the Mac is at its OS ceiling and stays there), and the `numpy<2`
      # beside it rides along because 2.2.2 predates numpy 2. A bump here
      # does not fail CI -- `depth` is deliberately outside `dev` and no
      # test may import it -- it just silently breaks the one machine that
      # runs the model, and it rewrites the paragraph explaining the pin.
      # PR #176 did exactly that, and left the comment arguing for a
      # constraint it had just removed.
      #
      # Security advisories are knowingly accepted: `depth` is dev-Mac only
      # and NEVER enters the container (ADR 32; pyproject says so and
      # tests/test_packaging.py pins it in both directions), so a torch CVE
      # does not reach the deployed instance. pyproject's triage paragraph
      # is the checklist for the day the depth tier leaves this machine.
      - dependency-name: torch
      # `transformers` is depth-only too, and its upper bound exists to pair
      # with that torch. Nothing else in the tree imports it.
      - dependency-name: transformers
      # `numpy` outright, and the narrower rule that failed is worth recording
      # so nobody re-derives it. It appears TWICE: `numpy>=1.26` in the main
      # dependencies, and `numpy<2` in `depth`, which is there because torch
      # 2.2.2 predates numpy 2 and cannot initialise against it. Dependabot
      # cannot tell one from the other, so the first attempt blocked by update
      # *type* -- `version-update:semver-major`, on the reasoning that a major
      # widening is what turns `<2` into `<3`.
      #
      # **That does not work, and #247 is the proof**: "Update numpy
      # requirement from <2 to <3" is a *requirement* update, not a version
      # update, so `update-types` never applies to it. Three Dependabot PRs
      # were spent learning that (#176, #241, #247).
      #
      # Blocking numpy outright costs the main venv nothing: `numpy>=1.26` is
      # a floor that already accepts a 2.x without any bump, so there is no
      # update here worth having. Raising that floor deliberately is a human
      # decision, not a weekly PR.
      - dependency-name: numpy

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
