# Dependency updates, grouped so a week's bumps arrive as one reviewable PR
# per ecosystem rather than ten. Actions are pinned by commit SHA in the
# workflows (ENGINEERING §5); Dependabot understands the `# vX.Y.Z` comment
# convention and keeps both the SHA and the comment current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
